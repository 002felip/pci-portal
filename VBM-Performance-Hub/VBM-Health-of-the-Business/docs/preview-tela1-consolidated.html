<style>/* ═══ Setup Dashboards — barra superior + Configurações (padrão VBM Performance Studio / Kaizen) ═══
   Tema: html[data-bg="dark"|"light"] (o JS também grava data-theme, para os tokens do dashboard).
   Tela cheia (botão ou F11): a barra superior sai de cena. */
:root {
  --sd-blue: #3cb5e5; --sd-blue-light: #7dd3f0; --sd-dark: #0a1421; --sd-mid: #6b7c93; --sd-white: #f4f7fb;
  --sd-grad: linear-gradient(135deg, rgba(4,21,35,.97) 0%, rgba(8,45,79,.96) 60%, rgba(13,61,107,.95) 100%);
  --sd-ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94); --sd-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
.topnav {
  position: sticky; top: 0; z-index: 100; flex-shrink: 0;
  height: 64px; display: flex; align-items: center;
  padding: 0 max(2rem, env(safe-area-inset-right, 0px)) 0 max(2rem, env(safe-area-inset-left, 0px));
  background: var(--sd-grad), #02101c;
  border-bottom: 1px solid rgba(255,255,255,.05);
  box-shadow: 0 2px 20px rgba(13,38,64,.18);
}
.topnav-logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; position: relative; z-index: 1; }
.topnav-logo svg { height: 26px; width: auto; display: block; }
.topnav-brand {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; margin: 0;
  font-family: 'Poppins', 'Segoe UI', sans-serif; font-size: 1.02rem; line-height: 1;
  color: #fff; white-space: nowrap; pointer-events: none;
}
.topnav-brand-nome { font-weight: 300; letter-spacing: .08em; color: rgba(255,255,255,.88); }
.topnav-brand::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 1.5px; border-radius: 2px;
  background: linear-gradient(90deg, #3CB5E5, rgba(60,181,229,0));
}
.topnav-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; margin-left: auto; position: relative; z-index: 1; }
.settings-btn {
  display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
  border: none; border-radius: 100px; background: transparent; color: #fff; cursor: pointer; flex-shrink: 0;
  transition: background .25s, transform .35s var(--sd-ease-spring);
}
.settings-btn:hover { background: rgba(255,255,255,.12); }
.settings-btn[aria-expanded="true"] { background: rgba(255,255,255,.18); transform: rotate(50deg); }
.settings-btn:focus-visible, .settings-close:focus-visible, .theme-toggle-btn:focus-visible, .topnav-logo:focus-visible { outline: 2px solid var(--sd-blue-light); outline-offset: 2px; }
.topnav-user { display: flex; align-items: center; gap: 10px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.22); flex-shrink: 0; }
.topnav-user[hidden] { display: none; }
.topnav-user-text { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
.topnav-user-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(145deg, #7dd3f0, #1a8bbf);
  border: 1.5px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center;
  font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 11px; color: #fff; flex-shrink: 0;
}
.topnav-user-name { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11.5px; color: #fff; white-space: nowrap; }
.topnav-user-role { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6); white-space: nowrap; }
@media (max-width: 960px) { .topnav-brand { font-size: .9rem; } .topnav-user-role { display: none; } }
@media (max-width: 540px) {
  .topnav { padding: 0 16px; }
  .topnav-user-name { display: none; }
  .topnav-brand { position: relative; left: auto; top: auto; transform: none; font-size: .8rem; margin: 0 auto; }
}

/* Painel lateral de Configurações */
.settings-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; z-index: 399; transition: opacity .3s var(--sd-ease-out); }
.settings-backdrop.open { opacity: 1; pointer-events: auto; }
.settings-panel {
  position: fixed; top: 0; right: 0; width: 300px; max-width: 90vw; height: 100vh; background: #fff;
  box-shadow: -16px 0 48px rgba(9,20,34,.22); z-index: 400; display: flex; flex-direction: column;
  transform: translateX(100%); visibility: hidden; transition: transform .38s var(--sd-ease-out), visibility 0s .38s;
}
.settings-panel.open { transform: translateX(0); visibility: visible; transition: transform .38s var(--sd-ease-out); }
.settings-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eef1f6; }
.settings-panel-head h2 { margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: .92rem; letter-spacing: -.01em; color: var(--sd-dark); }
.settings-close { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: none; border-radius: 100px; background: #fafcfe; color: var(--sd-mid); cursor: pointer; transition: background .2s, color .2s; }
.settings-close svg { width: 11px; height: 11px; }
.settings-close:hover { background: var(--sd-blue); color: #fff; }
.settings-panel-body { padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
.settings-section { display: flex; flex-direction: column; gap: 9px; }
.settings-section-title { display: flex; align-items: center; gap: 5px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11px; color: var(--sd-dark); }
.settings-info { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #e8e8e8; color: var(--sd-mid); font-size: 8px; font-style: italic; font-family: Georgia, serif; cursor: help; }
.settings-divider { height: 1px; background: #eef1f6; margin: 18px 0; }
.theme-toggle { display: flex; align-items: center; background: #fafcfe; border: 1px solid #e8e8e8; border-radius: 100px; padding: .16rem; gap: .1rem; width: fit-content; }
.theme-toggle-btn { padding: .38rem 1.05rem; border-radius: 100px; font-size: .64rem; letter-spacing: .02em; color: var(--sd-mid); border: none; background: transparent; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; transition: background .2s, color .2s; white-space: nowrap; line-height: 1; }
.theme-toggle-btn.active { background: var(--sd-blue); color: #fff; box-shadow: 0 4px 14px rgba(60,181,229,.35); }
.settings-select-wrap { position: relative; }
.settings-select { width: 100%; appearance: none; -webkit-appearance: none; background: #fff; border: 1.5px solid #e8e8e8; border-radius: 9px; padding: .5rem 1.9rem .5rem .75rem; font-family: 'Poppins', sans-serif; font-size: 11.5px; font-weight: 500; color: var(--sd-dark); cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.settings-select:hover { border-color: var(--sd-blue-light); }
.settings-select:focus { outline: none; border-color: var(--sd-blue); box-shadow: 0 0 0 3px rgba(60,181,229,.15); }
.settings-select-caret { width: 9px; height: 9px; position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); color: var(--sd-mid); pointer-events: none; }
/* Painel no tema escuro: vidro */
[data-bg="dark"] .settings-panel { background: rgba(13,38,64,.96); border-left: 1px solid rgba(255,255,255,.12); box-shadow: -16px 0 48px rgba(0,0,0,.45); }
[data-bg="dark"] .settings-panel-head { border-bottom-color: rgba(255,255,255,.1); }
[data-bg="dark"] .settings-panel-head h2, [data-bg="dark"] .settings-section-title { color: #fff; }
[data-bg="dark"] .settings-close { background: rgba(255,255,255,.12); color: var(--sd-white); }
[data-bg="dark"] .settings-info { border-color: rgba(255,255,255,.25); color: rgba(255,255,255,.5); }
[data-bg="dark"] .settings-divider { background: rgba(255,255,255,.1); }
[data-bg="dark"] .theme-toggle { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.09); }
[data-bg="dark"] .theme-toggle-btn { color: rgba(255,255,255,.55); }
[data-bg="dark"] .theme-toggle-btn.active { color: #fff; }
[data-bg="dark"] .settings-select { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); color: var(--sd-white); }
[data-bg="dark"] .settings-select option { background: #0d2640; color: #fff; }
[data-bg="dark"] .settings-select-caret { color: rgba(255,255,255,.5); }

/* Tela cheia (botão → html.is-fs; F11 → display-mode): a barra superior sai de cena */
.is-fs .topnav { display: none; }
@media (display-mode: fullscreen) { .topnav { display: none; } }
@media (prefers-reduced-motion: reduce) { .settings-panel, .settings-backdrop, .settings-btn { transition: none; } }
/* ═══ fim Setup Dashboards ═══ */
</style>
<style>
/* Layout do PDF VBM Health of the Business com os gráficos do COO Business Units Dashboard:
   mesmos tokens, fontes, barras em degradê, valores acima das barras e cota de diferença (Delta). */
:root {
  --page: #FFFFFF; --text: #1F2937; --text-soft: #6B7280; --text-faint: #9CA3AF; --line: #E5E7EB;
  --accent: #1E8FC4; --accent-strong: #0B6E99; --panel: #F3F4F5; --chart-title: #1B7F7B;
  --ink-strong: #111827; --ink-soft: #6B7280; --base-line: #D1D5DB;
  --pill-bg: #FFFFFF; --pill-line: rgba(15,23,42,.06);
  --d-stroke: rgba(116,118,120,.45); --d-hair: rgba(116,118,120,.30);
  --serie-b: #BCBEC0; --serie-a: #3CB5E5; --serie-a-txt: #0B6E99;
  --good: #007E7A; --good-bg: rgba(0,126,122,.10); --bad: #B91C1C; --bad-bg: rgba(220,38,38,.09);
  --flat: #5B5E61; --flat-bg: rgba(116,118,120,.12);
  --w-pos: #1FA88F; --w-neg: #E5534B;
  --ctl-bg: #FFFFFF; --ctl-border: rgba(13,38,64,.16); --ctl-text: #1F2937; --ctl-on-bg: #0B6E99; --ctl-on-text: #FFFFFF;
  --focus: #0B6E99;
  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif; --font-ui: 'Poppins', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #06192B; --text: #E8EEF5; --text-soft: rgba(232,238,245,.66); --text-faint: rgba(232,238,245,.42); --line: rgba(255,255,255,.10);
    --accent: #5CC6EE; --accent-strong: #7DD3F0; --panel: #0C2438; --chart-title: #5FD0C9;
    --ink-strong: #F1F5F9; --ink-soft: rgba(241,245,249,.62); --base-line: rgba(255,255,255,.22);

    --w-pos: #34C3B8; --w-neg: #F87171;

  --page: #06192B; --text: #E8EEF5; --text-soft: rgba(232,238,245,.66); --text-faint: rgba(232,238,245,.42); --line: rgba(255,255,255,.10);
  --accent: #5CC6EE; --accent-strong: #7DD3F0; --panel: #0C2438; --chart-title: #5FD0C9;
  --ink-strong: #F1F5F9; --ink-soft: rgba(241,245,249,.62); --base-line: rgba(255,255,255,.22);
  --pill-bg: #0F2C44; --pill-line: rgba(255,255,255,.10); --d-stroke: rgba(226,232,240,.45); --d-hair: rgba(226,232,240,.28);
  --serie-b: #8E949B; --serie-a-txt: #7DD3F0;

  --w-pos: #34C3B8; --w-neg: #F87171;

  --focus: #7DD3F0; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font-family: var(--font-display); font-size: 14px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.page { width: 100%; display: flex; flex-direction: column; gap: 14px; padding-block: 22px 24px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 32px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.head h2 { margin: 0; position: relative; top: -7px; font: italic 300 clamp(1.7rem, 2.6vw, 2.5rem)/1.05 var(--font-display); color: var(--accent); letter-spacing: -.01em; text-wrap: balance; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.filter { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.filter-label { font: italic 400 .74rem var(--font-display); color: var(--text-soft); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 2px; border-radius: 9px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); }
.seg button { min-height: 26px; padding: 2px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; transition: background-color .18s ease, color .18s ease; }
.seg button:hover { background: color-mix(in srgb, var(--ctl-on-bg) 12%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); }
.switch { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); cursor: pointer; }
.switch-track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: color-mix(in srgb, var(--text-soft) 40%, transparent); transition: background-color .18s ease; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.25); transition: transform .18s ease; }
.switch[aria-checked="true"] .switch-track { background: var(--ctl-on-bg); }
.switch[aria-checked="true"] .switch-thumb { transform: translateX(14px); }
.fs-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--text-soft); cursor: pointer; }
.fs-btn:hover { color: var(--accent-strong); border-color: var(--accent-strong); }

.sub-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 24px; flex-wrap: wrap; }
.panel-title { margin: 0; font: italic 400 1.18rem var(--font-display); color: var(--text); }
.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; font-size: .74rem; color: var(--text-soft); }
.legend li { display: flex; align-items: center; gap: 7px; }
.swatch { width: 14px; height: 9px; border-radius: 2px; }
.updated { margin: 0; font: italic 400 .7rem var(--font-display); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.demo { font-style: normal; margin-right: 6px; padding: 0 7px; border-radius: 999px; border: 1px solid rgba(245,158,11,.6); color: #B45309; }
:root[data-theme="dark"] .demo { color: #FCD34D; }

/* Grade em duas colunas; as áreas de cada visão vêm do JS (BUS[].areas) */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px 64px; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 12px; }
.card-name { min-width: 0; }
.card-title { margin: 0; font: 400 1rem/1.2 var(--font-display); color: var(--chart-title); }
.card-title em { font: italic 400 .74rem var(--font-display); color: var(--text-soft); }
.card-unit { margin: 1px 0 0; font: 400 .74rem var(--font-display); color: var(--text-faint); }
.card .seg { flex-wrap: nowrap; flex-shrink: 0; }
.card .seg button { min-height: 22px; padding: 1px 8px; font-size: .68rem; }
.chart { position: relative; height: var(--chart-h, 210px); }
.chart svg { display: block; overflow: visible; font-family: var(--font-display); }

/* SVG — mesmas classes e tamanhos do COO */
.b-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.16,.84,.28,1) both; }
.b-bar.neg { transform-origin: 50% 0%; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.b-val { fill: var(--ink-strong); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.b-axis { fill: var(--ink-soft); font-size: 9.5px; }
.b-base { stroke: var(--base-line); }
.cota { animation: fade .5s .6s ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.d-ref { stroke: var(--d-stroke); stroke-dasharray: 3 2; }
.d-now { stroke: var(--d-stroke); }
.d-track { stroke: var(--d-hair); }
.d-pill { fill: var(--pill-bg); stroke: var(--pill-line); filter: drop-shadow(0 2px 6px rgba(15,23,42,.06)); }
.d-txt { font-size: 10.5px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.d-span { stroke-opacity: .6; }
.is-good .d-txt { fill: var(--good); } .is-good .d-span { stroke: var(--good); } .is-good .d-up { fill: var(--good-bg); } .is-good .d-dn { fill: url(#hatch-good); }
.is-bad .d-txt { fill: var(--bad); } .is-bad .d-span { stroke: var(--bad); } .is-bad .d-up { fill: var(--bad-bg); } .is-bad .d-dn { fill: url(#hatch-bad); }
.is-flat .d-txt { fill: var(--flat); } .is-flat .d-span { stroke: var(--flat); } .is-flat .d-up { fill: var(--flat-bg); } .is-flat .d-dn { fill: url(#hatch-flat); }
/* Ponte (waterfall) e curva S, no mesmo acabamento */
.w-pos { fill: var(--w-pos); } .w-neg { fill: var(--w-neg); }
.w-link { stroke: var(--d-hair); stroke-dasharray: 2 2; }
.l-b { fill: none; stroke: var(--serie-b); stroke-width: 1.6; stroke-dasharray: 4 3; }
.l-a { fill: none; stroke: var(--serie-a); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.l-f { fill: none; stroke: var(--serie-a); stroke-width: 2; stroke-dasharray: 2 3; }
.p-b { fill: var(--page); stroke: var(--serie-b); stroke-width: 1.6; } .p-a { fill: var(--serie-a); stroke: var(--page); stroke-width: 1.2; }
.v-b { fill: var(--ink-soft); font-size: 10px; font-variant-numeric: tabular-nums; } .v-a { fill: var(--serie-a-txt); font-size: 10px; font-weight: 500; font-variant-numeric: tabular-nums; }
.l-sep { stroke: var(--line); }
.is-static .b-bar, .is-static .cota { animation: none; }
@media (prefers-reduced-motion: reduce) { .b-bar, .cota { animation: none !important; } }
.tip { position: fixed; z-index: 200; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: #0B3A50; color: #fff; font: 500 .74rem var(--font-ui); box-shadow: 0 6px 18px rgba(15,23,42,.25); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font: 400 .7rem var(--font-display); font-variant-numeric: tabular-nums; }
.tbl th { background: var(--accent-strong); color: #fff; font-weight: 500; padding: 5px 6px; text-align: center; white-space: nowrap; }
.tbl td { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.tbl tr.on td { background: color-mix(in srgb, var(--serie-a) 14%, transparent); font-weight: 600; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }

@media (max-width: 1600px) {
  .card-title { font-size: .88rem; }
  .card .seg button { padding: 1px 5px; font-size: .62rem; }
  .head h2 { font-size: 1.75rem; }
  .filters { gap: 8px 10px; }
  .seg button { padding: 2px 8px; font-size: .7rem; }
}
@media (max-width: 1000px) {
  .dash { grid-template-columns: minmax(0, 1fr); grid-template-areas: none !important; }
  .dash > .card { grid-area: auto !important; }
}
@media (max-width: 720px) {
  .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .meta { align-items: flex-start; }
  .head h2 { top: 0; }
}
@media (pointer: coarse) { .seg button, .card .seg button { min-height: 44px; } .fs-btn { width: 44px; height: 44px; } }

<script>/* ═══ Setup Dashboards — barra superior + painel de Configurações (padrão VBM Performance Studio / Kaizen) ═══
   Colar num <script> logo depois da marcação (setup-dashboards.html), ANTES do script do dashboard.
   Configuração opcional, declarada antes deste script:
     window.VBM_SETUP = {
       idiomaPadrao: 'pt-BR' | 'en',          // sem escolha salva; padrão 'pt-BR'
       numeroPadrao: 'pt-BR' | 'en-CA',       // sem escolha salva; padrão: pelo idioma do navegador
       urlUsuario: '/api/me'                  // { nome, email, cargo } — rota do Portal (Kaizen)
     };
   Preferências por pessoa no navegador, com as MESMAS chaves do Kaizen e do Studio,
   para valerem em todas as aplicações do Portal: vdt-theme, vdt-lang, vdt-num.
   API para o dashboard (window.VBMSetup):
     t(chave, vars)         texto no idioma atual ('Olá {nome}' + { nome: 'Ana' })
     registrar(dic)         { 'pt-BR': { chave: texto }, en: { … } } — textos do dashboard
     traduzir(raiz?)        aplica data-i18n / -aria / -title / -ph em raiz (padrão: document)
     fmt(valor, casas)      número no formato escolhido (Brasil 1.234,56 · Canadá 1,234.56)
     dataHora(data)         data e hora no idioma escolhido
     on('tema'|'idioma'|'numero', fn)   redesenhar o que o JS monta
     tema / idioma / numero (leitura) */
window.VBMSetup = (function () {
  'use strict';
  var CFG = window.VBM_SETUP || {};
  var CHAVES = { tema: 'vdt-theme', idioma: 'vdt-lang', numero: 'vdt-num' };
  var IDIOMAS = ['pt-BR', 'en'], NUMEROS = ['pt-BR', 'en-CA'];
  var DIC = {
    'pt-BR': { 'sd.menu': 'Menu', 'sd.configuracoes': 'Configurações', 'sd.fechar': 'Fechar', 'sd.tema': 'Tema', 'sd.claro': 'Claro', 'sd.escuro': 'Escuro',
      'sd.idioma': 'Idioma', 'sd.idiomaInfo': 'Idioma da interface', 'sd.numero': 'Formato numérico', 'sd.numeroInfo': 'Separador decimal e de milhar dos gráficos',
      'sd.numeroBR': 'Brasil — 1.234,56', 'sd.numeroCA': 'Canadá — 1,234.56' },
    en: { 'sd.menu': 'Menu', 'sd.configuracoes': 'Settings', 'sd.fechar': 'Close', 'sd.tema': 'Theme', 'sd.claro': 'Light', 'sd.escuro': 'Dark',
      'sd.idioma': 'Language', 'sd.idiomaInfo': 'Interface language', 'sd.numero': 'Number format', 'sd.numeroInfo': 'Decimal and thousands separators in charts',
      'sd.numeroBR': 'Brazil — 1.234,56', 'sd.numeroCA': 'Canada — 1,234.56' }
  };
  var ouvintes = { tema: [], idioma: [], numero: [] };
  function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function gravar(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* só nesta sessão */ } }
  function avisar(evt) { ouvintes[evt].forEach(function (fn) { try { fn(estado[evt]); } catch (e) { console.error('[setup-dashboards]', e); } }); }
  var $ = function (id) { return document.getElementById(id); };

  var estado = {
    tema: ler(CHAVES.tema) === 'dark' ? 'dark' : 'light',
    idioma: IDIOMAS.indexOf(ler(CHAVES.idioma)) >= 0 ? ler(CHAVES.idioma) : (IDIOMAS.indexOf(CFG.idiomaPadrao) >= 0 ? CFG.idiomaPadrao : 'pt-BR'),
    numero: NUMEROS.indexOf(ler(CHAVES.numero)) >= 0 ? ler(CHAVES.numero)
      : NUMEROS.indexOf(CFG.numeroPadrao) >= 0 ? CFG.numeroPadrao : (/^en|^fr/i.test(navigator.language || '') ? 'en-CA' : 'pt-BR')
  };

  function t(chave, vars) {
    var s = (DIC[estado.idioma] || {})[chave];
    if (s == null) s = DIC['pt-BR'][chave];
    if (s == null) return chave;
    return vars ? s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }) : s;
  }
  function registrar(dic) {
    Object.keys(dic || {}).forEach(function (l) { DIC[l] = DIC[l] || {}; for (var k in dic[l]) DIC[l][k] = dic[l][k]; });
  }
  function traduzir(raiz) {
    raiz = raiz || document;
    raiz.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    [['data-i18n-aria', 'aria-label'], ['data-i18n-title', 'title'], ['data-i18n-ph', 'placeholder']].forEach(function (par) {
      raiz.querySelectorAll('[' + par[0] + ']').forEach(function (el) { el.setAttribute(par[1], t(el.getAttribute(par[0]))); });
    });
  }
  function fmt(v, casas) {
    return Number(v).toLocaleString(estado.numero, { minimumFractionDigits: casas, maximumFractionDigits: casas }).replace('-', '−');
  }
  function dataHora(d) {
    var l = estado.idioma === 'en' ? 'en-US' : 'pt-BR';
    return d.toLocaleDateString(l) + ' ' + d.toLocaleTimeString(l);
  }

  // ── Tema: data-bg (barra e painel) + data-theme (tokens do dashboard) ──
  function aplicarTema(tema, salvar) {
    estado.tema = tema === 'dark' ? 'dark' : 'light';
    var html = document.documentElement;
    html.setAttribute('data-bg', estado.tema);
    html.setAttribute('data-theme', estado.tema);
    if ($('btnWhite')) $('btnWhite').classList.toggle('active', estado.tema === 'light');
    if ($('btnBusiness')) $('btnBusiness').classList.toggle('active', estado.tema === 'dark');
    if (salvar) { gravar(CHAVES.tema, estado.tema); avisar('tema'); }
  }
  function aplicarIdioma(l, salvar) {
    estado.idioma = IDIOMAS.indexOf(l) >= 0 ? l : 'pt-BR';
    document.documentElement.lang = estado.idioma;
    if ($('langSelect')) $('langSelect').value = estado.idioma;
    traduzir();
    if (salvar) { gravar(CHAVES.idioma, estado.idioma); avisar('idioma'); }
  }
  function aplicarNumero(n, salvar) {
    estado.numero = NUMEROS.indexOf(n) >= 0 ? n : 'pt-BR';
    if ($('numSelect')) $('numSelect').value = estado.numero;
    if (salvar) { gravar(CHAVES.numero, estado.numero); avisar('numero'); }
  }

  // ── Painel de Configurações (engrenagem) ──
  var btn = $('settingsBtn'), painel = $('settingsPanel'), fundo = $('settingsBackdrop');
  function abrir(sim) {
    if (!painel) return;
    painel.classList.toggle('open', sim); fundo.classList.toggle('open', sim);
    btn.setAttribute('aria-expanded', String(sim)); painel.setAttribute('aria-hidden', String(!sim));
    if (sim) { var f = painel.querySelector('.theme-toggle-btn.active') || painel.querySelector('button'); if (f) f.focus(); } else btn.focus();
  }
  if (btn && painel && fundo) {
    btn.addEventListener('click', function () { abrir(!painel.classList.contains('open')); });
    $('settingsClose').addEventListener('click', function () { abrir(false); });
    fundo.addEventListener('click', function () { abrir(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && painel.classList.contains('open')) abrir(false); });
    $('btnWhite').addEventListener('click', function () { aplicarTema('light', true); });
    $('btnBusiness').addEventListener('click', function () { aplicarTema('dark', true); });
    $('langSelect').addEventListener('change', function (e) { aplicarIdioma(e.target.value, true); });
    $('numSelect').addEventListener('change', function (e) { aplicarNumero(e.target.value, true); });
  }

  // ── Tela cheia: html.is-fs (a barra superior sai de cena pelo CSS) ──
  document.addEventListener('fullscreenchange', function () {
    document.documentElement.classList.toggle('is-fs', !!document.fullscreenElement);
    if (document.fullscreenElement) abrir(false);
  });

  // ── Usuário logado: nome, cargo e iniciais (rota do Portal) ──
  fetch(CFG.urlUsuario || '/api/me', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) {
      if (!me || !$('topnavUser')) return;
      var nome = String(me.nome || me.email || '').trim();
      if (!nome) return;
      var partes = nome.split(/\s+/);
      $('topnavUserName').textContent = nome;
      $('topnavUserRole').textContent = me.cargo || '';
      $('topnavUserAvatar').textContent = ((partes[0] || '')[0] || '') + (partes.length > 1 ? partes[partes.length - 1][0] : '');
      $('topnavUserAvatar').title = nome;
      $('topnavUser').hidden = false;
    })
    .catch(function () { /* sem a rota (ex.: fora do Portal): a barra fica sem o usuário */ });

  aplicarTema(estado.tema, false);
  aplicarNumero(estado.numero, false);
  aplicarIdioma(estado.idioma, false);

  return {
    t: t, registrar: registrar, traduzir: traduzir, fmt: fmt, dataHora: dataHora,
    on: function (evt, fn) { if (ouvintes[evt]) ouvintes[evt].push(fn); },
    get tema() { return estado.tema; }, get idioma() { return estado.idioma; }, get numero() { return estado.numero; }
  };
})();
/* ═══ fim Setup Dashboards ═══ */
</script>
<script>/* VBM Health of the Business — DADOS DE DEMONSTRAÇÃO.
   Valores ilustrativos (ordem de grandeza do PDF de referência), gerados de forma
   determinística, só para validar o desenho. Quando a fonte existir (Azure SQL do
   Performance Hub, como no COO), troque este arquivo por uma chamada à API que
   devolva o MESMO formato:

   HOB_DATA = {
     fonte: 'demo' | 'db', atualizado: ISO, anos: [..], ultimoReal: { ano, mes },
     bu: { <vbm|cu|ni>: { <ano>: {
       <indicador mensal>: { b: [12], a: [12] },   // b = Budget; a = Actual até ultimoReal, Forecast depois
       ebitdaYear: [{ lbl, v, tipo }],             // ponte do EBITDA do ano (só vbm)
       fcfYear:    [{ lbl, v, tipo }]              // ponte do FCF do ano (só vbm)
     } } }
   }
   tipo da ponte: 'tot' (barra cheia, reinicia o acumulado), 'd' (variação flutuante),
   'sub' (subtotal calculado), 'ref' (referência, ex.: Budget), 'zero' (reinicia o acumulado em 0). */
(function () {
  var semente = 20261029;
  function rnd() { semente = (semente * 1664525 + 1013904223) % 4294967296; return semente / 4294967296; }
  var SAZ = [0.9, 0.88, 0.97, 0.98, 1.02, 1.0, 1.04, 1.03, 1.0, 1.04, 1.06, 1.08];

  // base mensal; vol = desvio do Actual | Forecast contra o Budget
  function serie(base, vol, semSaz) {
    var b = [], a = [];
    for (var m = 0; m < 12; m++) {
      var v = base * (semSaz ? 1 : SAZ[m]) * (1 + (rnd() - 0.5) * 0.06);
      b.push(v);
      a.push(v * (1 + (rnd() - 0.38) * vol)); // leve viés, para o Delta aparecer na demo
    }
    return { b: b, a: a };
  }

  function negocio(k, p) {
    return {
      prod: serie(p.prod * k, 0.10), sales: serie(p.sales * k, 0.12),
      ebitda: serie(p.ebitda * k, 0.25), capex: serie(p.capex * k, 0.35),
      fcf: serie(p.fcf * k, 0.6),
      sus: serie(p.sus, 0.25, true), cost: serie(p.cost, 0.08, true), byp: serie(p.byp, 0.08, true)
    };
  }
  function vbm(k) {
    return {
      ebitdaCu: serie(0.32 * k, 0.12), ebitdaNi: serie(0.085 * k, 0.4), ebitdaOut: serie(-0.009 * k, 0.6),
      capex: serie(132 * k, 0.3),
      ebitdaYear: [
        { lbl: 'FY M-1 (Act/Fcst)', v: Math.round(4874 * k), tipo: 'tot' },
        { lbl: 'FX impact', v: 16, tipo: 'd' }, { lbl: 'Price', v: -200, tipo: 'd' }, { lbl: 'Volume', v: -17, tipo: 'd' },
        { lbl: 'Unit COGS', v: -58, tipo: 'd' }, { lbl: 'Other', v: 49, tipo: 'd' },
        { lbl: 'FY Act/Fcst', tipo: 'sub' },
        { tipo: 'zero' },
        { lbl: 'Copper', v: Math.round(3881 * k), tipo: 'd' }, { lbl: 'Nickel', v: Math.round(963 * k), tipo: 'd' },
        { lbl: 'Other Seg.', v: -179, tipo: 'd' }, { lbl: 'Non-Alloc.', v: 0, tipo: 'd' }
      ],
      fcfYear: [
        { lbl: (k < 1 ? '2024' : '2025') + ' Net Debt', v: 1189, tipo: 'tot' },
        { lbl: 'EBITDA', v: Math.round(4665 * k), tipo: 'tot' },
        { lbl: 'Streaming & Wheaton Bonus', v: -1210, tipo: 'd' }, { lbl: 'ARO, PTVI, Energy', v: -284, tipo: 'd' },
        { lbl: 'Working Capital', v: 127, tipo: 'd' },
        { lbl: 'Gross Operational Cash Flow', tipo: 'sub' },
        { lbl: 'Investments', v: -1488, tipo: 'd' }, { lbl: 'Income Tax', v: -445, tipo: 'd' },
        { lbl: 'Financial Expenses / Income', v: -241, tipo: 'd' }, { lbl: 'Others', v: 331, tipo: 'd' },
        { lbl: 'Free Cash Flow', tipo: 'sub' },
        { lbl: 'Debt Adjustments (accrued interest, FX variation)', v: 1154, tipo: 'tot' },
        { lbl: (k < 1 ? '2025B' : '2026B') + ' Net Debt', v: -27, tipo: 'ref' },
        { lbl: (k < 1 ? '2025F' : '2026F') + ' Net Debt', v: 1784, tipo: 'tot' }
      ]
    };
  }
  function porAno(fn) { return { 2025: fn(0.96), 2026: fn(1) }; }

  window.HOB_DATA = {
    fonte: 'demo',
    atualizado: '2026-10-20T18:51:11',
    anos: [2025, 2026],
    ultimoReal: { ano: 2026, mes: 9 },
    bu: {
      vbm: porAno(vbm),
      cu: porAno(function (k) { return negocio(k, { prod: 31, sales: 30, ebitda: 310, capex: 52, fcf: 160, sus: 1.3, cost: 6.9, byp: -7.1 }); }),
      ni: porAno(function (k) { return negocio(k, { prod: 13.5, sales: 13, ebitda: 80, capex: 85, fcf: 25, sus: 4.2, cost: 14.5, byp: -3.4 }); })
    }
  };
})();

      's.drivers': 'Production and Finance drivers', 'fs.on': 'Full screen', 'g.var': 'change' }
  });
  var MESES = { 'pt-BR': ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],

  var MESES_LONGOS = { 'pt-BR': ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'],

  function mesesCurtos() { return MESES[S.idioma] || MESES.en; }

  // Seletores no card: mesma estratégia do All-in do COO (a pessoa escolhe o que o gráfico mostra)
  var OPC_EBITDA = [{ chave: 'vbm', lbl: 'VBM' }, { chave: 'cu', lbl: 'Copper' }, { chave: 'ni', lbl: 'Nickel' }, { chave: 'out', lbl: 'Others' }];
  var OPC_ALLIN = [{ chave: 'allin', lbl: 'All-in' }, { chave: 'sus', lbl: 'Sustaining' }, { chave: 'cost', lbl: 'Cost' }, { chave: 'byp', lbl: 'By Product' }];

  function negocio(chave, lbl) {
    return { chave: chave, lbl: lbl, nome: lbl,
      areas: '"prod ebitda" "sales capex" "allin fcf"',
      cards: [
        { area: 'prod', tipo: 'pares', titulo: 'Production', unid: 'Kt', ind: 'prod', casas: 0, pol: 'up' },
        { area: 'sales', tipo: 'pares', titulo: 'Sales', unid: 'Kt', ind: 'sales', casas: 0, pol: 'up' },
        { area: 'allin', tipo: 'allin', titulo: 'All-In (AISC)', unid: 'US$ k/t', casas: 1, pol: 'down' },
        { area: 'ebitda', tipo: 'pares', titulo: 'EBITDA', unid: 'US$ M', ind: 'ebitda', casas: 0, pol: 'up' },
        { area: 'capex', tipo: 'scurve', titulo: 'Capex | S Curve', unid: 'US$ M', ind: 'capex', pol: 'down' },
        { area: 'fcf', tipo: 'acum', titulo: 'FCF', unid: 'US$ M', ind: 'fcf' }
      ] };
  }
  // Consolidated: Catalyst Savings 2025F descontinuado. Sem a tabela, o EBITDA fica do tamanho dos
  // demais e divide a 1ª linha com a ponte do EBITDA do ano; o Capex | S Curve ganha a largura toda
  // (12 meses + ano) e o FCF YEAR segue embaixo, também na largura toda.
  var BUS = [

  ];

  // ── Estado (na URL, para o link poder ser compartilhado) ──
  var U = D.ultimoReal, q = new URLSearchParams(location.search);
  var state = {
    bu: BUS.some(function (b) { return b.chave === q.get('bu'); }) ? q.get('bu') : 'vbm',
    ano: D.anos.indexOf(+q.get('ano')) >= 0 ? +q.get('ano') : U.ano,
    mes: +q.get('mes') >= 1 && +q.get('mes') <= 12 ? +q.get('mes') : U.mes,
    delta: q.get('delta') !== 'off',
    sel: { ebitda: q.get('ebitda') || 'vbm', allin: q.get('allin') || 'allin' }
  };
  function gravarUrl() {
    var p = { bu: state.bu, ano: state.ano, mes: state.mes, ebitda: state.sel.ebitda, allin: state.sel.allin };
    if (!state.delta) p.delta = 'off';
    history.replaceState(null, '', '?' + new URLSearchParams(p));
  }
  function ehReal(mes) { return state.ano < U.ano || (state.ano === U.ano && mes <= U.mes); }
  function aa() { return String(state.ano).slice(2); }
  function fmt(v, dec) { return S.fmt(v, dec); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function somaArr(a, b) { return a.map(function (v, i) { return v + b[i]; }); }
  function somaSerie(ss) { return ss.reduce(function (r, s) { return { b: somaArr(r.b, s.b), a: somaArr(r.a, s.a) }; }); }

  // Delta = A|F − B, na unidade e casas do indicador (regra do COO)
  function delta(b, a, pol, dec) {
    var f = Math.pow(10, dec), d = Math.round((a - b) * f) / f;

  // media = custo unitário (All-in): média dos meses; os demais somam.
  function recortes(s, media) {
    var m = state.mes, t = Math.ceil(m / 3), l = mesesCurtos();
    function ag(arr, de, ate) {
      var v = arr.slice(de, ate).reduce(function (x, y) { return x + y; }, 0);
      return media ? v / (ate - de) : v;
    }
    function af(de, ate) { for (var i = de + 1; i <= ate; i++) if (!ehReal(i)) return 'F'; return 'A'; }
    var g = [
      { lb: l[m - 1] + ' B', la: l[m - 1] + ' ' + af(m - 1, m), b: s.b[m - 1], a: s.a[m - 1] },
      { lb: 'Q' + t + 'B', la: 'Q' + t + af(t * 3 - 3, t * 3), b: ag(s.b, t * 3 - 3, t * 3), a: ag(s.a, t * 3 - 3, t * 3) },
      { lb: 'YTD B', la: 'YTD ' + af(0, m), b: ag(s.b, 0, m), a: ag(s.a, 0, m) }
    ];
    if (m < 12) g.push({ lb: 'YTG B', la: 'YTG ' + af(m, 12), b: ag(s.b, m, 12), a: ag(s.a, m, 12) });
    g.push({ lb: aa() + 'B', la: aa() + af(0, 12), b: ag(s.b, 0, 12), a: ag(s.a, 0, 12) });
    return g;
  }

  // ── Barras B × A|F com a cota de diferença: o chartSvg do COO, com N janelas em vez de três ──
  function cota(y, y0, x1, x2, vRef, vNovo, dl) {
    var cx = (x1 + x2) / 2, yr = y(vRef), yn = y(vNovo);
    var ytop = Math.min(yr, yn, y0), pillH = 17, pillW = Math.max(38, dl.txt.length * 5.8 + 14), pillY = Math.max(0, ytop - 22 - pillH);

  // ── Curva S: mensal B (tracejado) e A|F (cheio no Actual, pontilhado no Forecast); com ano = barras B × F à direita ──

        if (dl[k] === 0) { m[k] = m[k + 1] = 0; continue; }

      out += '<circle class="p-a" cx="' + px(j) + '" cy="' + y(a[j]) + '" r="3.6" data-tip="' + esc(l[j] + ' ' + (ehReal(j + 1) ? 'A' : 'F') + ': ' + fmt(a[j], 0) + ' ' + cfg.unid) + '"/>';
      if (rotulos) {
        out += '<text class="v-b" x="' + px(j) + '" y="' + (y(b[j]) + (acima ? 15 : -8)) + '" text-anchor="middle">' + fmt(b[j], 0) + '</text>';
        out += '<text class="v-a" x="' + px(j) + '" y="' + (y(a[j]) + (acima ? -8 : 15)) + '" text-anchor="middle">' + fmt(a[j], 0) + '</text>';

      var BW = Math.max(16, Math.min(72, PW * 0.3)), GAP = Math.max(8, Math.min(28, PW * 0.1)), xb = x0 + PW / 2 - GAP / 2 - BW, xa = xb + BW + GAP;

      out += barra(xb, BW, ya, y0, fb, 'g-b', 0, lb + ' · Budget: ' + fmt(fb, 0) + ' ' + cfg.unid);
      out += barra(xa, BW, ya, y0, fa, 'g-a', 0, la + ': ' + fmt(fa, 0) + ' ' + cfg.unid);

  // ── Ponte (waterfall): totais em degradê azul, Budget em cinza, variações em verde/vermelho, fio entre degraus ──

  function tabela(cab, linhas, ativa) {

  // ── Cards ──

      var cab = ['All-In']; c.sus.forEach(function (g) { cab.push(g.lb, g.la); });

    }

      '<div class="card-head"><div class="card-name"><h4 class="card-title">' + esc(titulo) + (cfg.nota ? ' <em>' + esc(cfg.nota) + '</em>' : '') + '</h4>' +
      '<p class="card-unit">(' + esc(cfg.unid) + ')</p></div>' + ctl + '</div>' +

  function dadosBu() { return D.bu[state.bu][state.ano]; }
  function allinComp() {
    var d = dadosBu();

  }
  function svgDoCard(cfg, W, H) {

  function bu() { return BUS.filter(function (b) { return b.chave === state.bu; })[0]; }
  function drawChart(el, forcar) {

    el.innerHTML = svgDoCard(bu().cards[+el.getAttribute('data-card')], W, H);
  }

  // ── Filtros (Business Units no lugar do drill-down País › Site do COO) ──
  var FILTROS = {
    bu: function () { return BUS.map(function (b) { return { v: b.chave, lbl: b.lbl }; }); },
    ano: function () { return D.anos.map(function (a) { return { v: a, lbl: String(a) }; }); },
    tri: function () { return [1, 2, 3, 4].map(function (t) { return { v: t, lbl: 'Q' + t }; }); },
    mes: function () { var t = Math.ceil(state.mes / 3), l = MESES_LONGOS[S.idioma] || MESES_LONGOS.en; return [0, 1, 2].map(function (i) { var m = t * 3 - 2 + i; return { v: m, lbl: l[m - 1] }; }); }
  };
  function valor(k) { return k === 'tri' ? Math.ceil(state.mes / 3) : state[k]; }
  function renderFiltros() {
    document.querySelectorAll('[data-filter]').forEach(function (g) {
      var k = g.getAttribute('data-filter');
      g.innerHTML = FILTROS[k]().map(function (o) {
        return '<button type="button" data-k="' + k + '" data-v="' + o.v + '" aria-pressed="' + (valor(k) === o.v) + '">' + esc(o.lbl) + '</button>';

  }
  document.querySelector('.filters').addEventListener('click', function (ev) {

  });

  var dash = document.getElementById('dash');
  dash.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-sel]'); if (!b) return;
    state.sel[b.getAttribute('data-sel')] = b.getAttribute('data-v');
    gravarUrl(); render();
  });
  var ro = new ResizeObserver(function (en) { en.forEach(function (e) { drawChart(e.target); }); });
  var primeira = true;
  function render() {
    var b = bu();
    renderFiltros();
    document.getElementById('buName').textContent = b.nome;
    var badge = document.getElementById('dataBadge');
    badge.hidden = D.fonte !== 'demo'; badge.textContent = S.t('l.demo');
    document.getElementById('updTxt').textContent = S.dataHora(new Date(D.atualizado));
    ro.disconnect();
    dash.style.gridTemplateAreas = b.areas;
    dash.innerHTML = b.cards.map(cardHtml).join('');
    dash.querySelectorAll('.chart').forEach(function (el) { ro.observe(el); drawChart(el, true); });
    if (primeira) { primeira = false; setTimeout(function () { document.documentElement.classList.add('is-static'); }, 1600); }
  }

  // Dica (data-tip) como no COO
  var tip = document.getElementById('tip');

    var t = ev.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
    var r = tip.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - r.width - 8) + 'px';
    tip.style.top = Math.max(8, ev.clientY - r.height - 10) + 'px';
  });

  document.getElementById('fsBtn').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

  ['idioma', 'numero', 'tema'].forEach(function (e) { S.on(e, function () { S.traduzir(); render(); }); });
