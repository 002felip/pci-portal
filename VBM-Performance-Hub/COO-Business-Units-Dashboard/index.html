<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>COO Business Units</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap">
<style>
/* Layout: tela única com o ritmo do print original — título editorial em itálico,
   painel cinza de Produção (3×3) e Financeiro solto
   na página (2×3). Gráficos com altura contida e barras estreitas; o espaço
   em branco entre as linhas é parte do desenho. Padrão de séries e cota de
   diferença do VBM Performance Hub. */
:root {
  --page: #FFFFFF;
  --text: #1F2937;
  --text-soft: #6B7280;
  --text-faint: #9CA3AF;
  --line: #E5E7EB;
  --accent: #1E8FC4;          /* títulos grandes (3,9:1 em branco, uso só em ≥24px) */
  --accent-strong: #0B6E99;
  --panel: #F3F4F5;
  --chart-title: #1B7F7B;
  --ink-strong: #111827;
  --ink-soft: #6B7280;
  --base-line: #D1D5DB;
  --pill-bg: #FFFFFF;
  --pill-line: rgba(15,23,42,.06);
  --d-stroke: rgba(116,118,120,.45);
  --d-hair: rgba(116,118,120,.30);
  --badge-bg: rgba(31,41,55,.58);
  --badge-text: #FFFFFF;
  --serie-b: #BCBEC0;
  --serie-a: #3CB5E5;
  --good: #007E7A;
  --good-bg: rgba(0,126,122,.10);
  --bad: #B91C1C;
  --bad-bg: rgba(220,38,38,.09);
  --flat: #5B5E61;
  --flat-bg: rgba(116,118,120,.12);
  --ctl-bg: #FFFFFF;
  --ctl-border: rgba(13,38,64,.16);
  --ctl-text: #1F2937;
  --ctl-on-bg: #0B6E99;
  --ctl-on-text: #FFFFFF;
  --focus: #0B6E99;
  --nav-bg: linear-gradient(135deg, #041523 0%, #072842 55%, #0b3a64 100%);
  --table-head: #0B6E99;

  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-ui: 'Poppins', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #06192B;
    --text: #E8EEF5;
    --text-soft: rgba(232,238,245,.66);
    --text-faint: rgba(232,238,245,.42);
    --line: rgba(255,255,255,.10);
    --accent: #5CC6EE;
    --accent-strong: #7DD3F0;
    --panel: #0C2438;
    --chart-title: #5FD0C9;
    --ink-strong: #F1F5F9;
    --ink-soft: rgba(241,245,249,.62);
    --base-line: rgba(255,255,255,.22);
    --pill-bg: #0F2C44;
    --pill-line: rgba(255,255,255,.10);
    --d-stroke: rgba(226,232,240,.45);
    --d-hair: rgba(226,232,240,.28);
    --badge-bg: rgba(2,10,20,.55);
    --serie-b: #8E949B;
    --good: #34C3B8;
    --good-bg: rgba(52,195,184,.14);
    --bad: #F87171;
    --bad-bg: rgba(248,113,113,.14);
    --flat: #B0B5BA;
    --flat-bg: rgba(176,181,186,.14);
    --ctl-bg: rgba(255,255,255,.05);
    --ctl-border: rgba(255,255,255,.16);
    --ctl-text: #E5EDF5;
    --ctl-on-bg: #3CB5E5;
    --ctl-on-text: #02101c;
    --focus: #7DD3F0;
    --table-head: #11577A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #06192B;
  --text: #E8EEF5;
  --text-soft: rgba(232,238,245,.66);
  --text-faint: rgba(232,238,245,.42);
  --line: rgba(255,255,255,.10);
  --accent: #5CC6EE;
  --accent-strong: #7DD3F0;
  --panel: #0C2438;
  --chart-title: #5FD0C9;
  --ink-strong: #F1F5F9;
  --ink-soft: rgba(241,245,249,.62);
  --base-line: rgba(255,255,255,.22);
  --pill-bg: #0F2C44;
  --pill-line: rgba(255,255,255,.10);
  --d-stroke: rgba(226,232,240,.45);
  --d-hair: rgba(226,232,240,.28);
  --badge-bg: rgba(2,10,20,.55);
  --serie-b: #8E949B;
  --good: #34C3B8;
  --good-bg: rgba(52,195,184,.14);
  --bad: #F87171;
  --bad-bg: rgba(248,113,113,.14);
  --flat: #B0B5BA;
  --flat-bg: rgba(176,181,186,.14);
  --ctl-bg: rgba(255,255,255,.05);
  --ctl-border: rgba(255,255,255,.16);
  --ctl-text: #E5EDF5;
  --ctl-on-bg: #3CB5E5;
  --ctl-on-text: #02101c;
  --focus: #7DD3F0;
  --table-head: #11577A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; min-height: 0;
  background: var(--page); color: var(--text);
  font-family: var(--font-display); font-size: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 110; background: #041523; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ── Topnav do Performance Hub (mais baixo, para dar a altura aos gráficos) ── */
.topnav {
  flex-shrink: 0; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  min-height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-block: 6px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--nav-bg); box-shadow: 0 2px 20px rgba(13,38,64,.18);
}
.topnav-logo { display: flex; align-items: center; }
.topnav-logo svg { height: 24px; width: auto; display: block; }
.topnav-brand { margin: 0; font: 300 .98rem var(--font-ui); letter-spacing: .08em; color: rgba(255,255,255,.88); position: relative; padding-bottom: 5px; white-space: nowrap; }
.topnav-brand::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(60,181,229,.15), #3CB5E5, rgba(60,181,229,.15)); }
.topnav-actions { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.nav-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 14px; border-radius: 999px; border: 1px solid rgba(125,211,240,.45); background: rgba(255,255,255,.04); color: #fff; font: 500 .76rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.nav-btn:hover { background: rgba(60,181,229,.16); }
.nav-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: #fff; cursor: pointer; }
.nav-icon:hover { background: rgba(255,255,255,.08); }

/* ── Página ── */
.page {
  flex: 1 1 auto; min-height: 0; width: 100%;
  padding-block: 12px 16px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

/* Cabeçalho editorial + filtros */
.head { position: relative; flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 32px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.title-block { min-width: 0; margin-bottom: -4px; position: relative; top: -7px; } /* título um pouco acima: centrado entre o topo e a linha do cabeçalho */
.title-block h2 { margin: 0; font: italic 300 clamp(1.7rem, 2.6vw, 2.5rem)/1.05 var(--font-display); color: var(--accent); letter-spacing: -.01em; text-wrap: balance; }
/* Unidade em linha própria (como no print), legenda e atualização alinhadas à direita */
.site-row { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px 24px; flex-wrap: wrap; margin-top: -2px; }
.site-row .panel-meta { position: relative; top: 10px; }
.site-id { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; min-width: 0; }
.site-nav { display: inline-flex; align-items: center; gap: 8px; position: relative; top: 6px; }
.site-nav[hidden] { display: none; }
.pager { display: inline-flex; gap: 4px; }
.nav-chip { min-height: 28px; padding: 2px 12px; border-radius: 999px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.nav-chip:hover:not(:disabled) { border-color: var(--ctl-on-bg); color: var(--ctl-on-bg); }
.nav-chip:disabled { opacity: .4; cursor: default; }
.pager .nav-chip { width: 28px; padding: 0; }
.site { margin: 0; position: relative; top: 4px; font: italic 400 2rem/1.1 var(--font-display); color: var(--accent); letter-spacing: -.005em; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.filter { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.filter-label { font: italic 400 .74rem var(--font-display); color: var(--text-soft); }
/* Unidade: drill-down País → Site */
.unit { position: relative; }
.unit-trigger { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 10px 2px 12px; border-radius: 9px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.unit-trigger:hover, .unit-trigger[aria-expanded="true"] { border-color: var(--ctl-on-bg); }
.unit-pais { color: var(--text-soft); }
.unit-sep { color: var(--text-faint); }
.unit-site { color: var(--ctl-on-bg); font-weight: 600; }
.unit-caret { color: var(--text-soft); transition: transform .18s ease; }
.unit-trigger[aria-expanded="true"] .unit-caret { transform: rotate(180deg); }
.unit-pop { position: absolute; z-index: 60; top: calc(100% + 6px); left: 0; width: 360px; display: grid; grid-template-columns: 1fr 1.15fr; gap: 0; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--page); box-shadow: 0 14px 34px rgba(15,23,42,.16); }
.unit-pop[hidden] { display: none; } /* fechado de verdade também fora do visualizador */
.unit-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 4px; }
.unit-col + .unit-col { border-left: 1px solid var(--line); padding-left: 10px; }
.unit-h { font: 600 .62rem var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); padding: 2px 8px 4px; }
.unit-list { display: flex; flex-direction: column; gap: 2px; }
.unit-list button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ctl-text); font: 500 .76rem var(--font-ui); text-align: left; cursor: pointer; }
.unit-list button:hover { background: color-mix(in srgb, var(--ctl-on-bg) 10%, transparent); }
.unit-list button .n { color: var(--text-faint); font-size: .68rem; }
.unit-pop #unitSites { max-height: min(60vh, 420px); overflow-y: auto; }
.unit-list button.sub { justify-content: flex-start; padding: 5px 10px 5px 22px; font-weight: 400; font-size: .72rem; color: var(--text-soft); }
.unit-list button.sub::before { content: '›'; margin-right: 6px; color: var(--text-faint); }
.unit-list button[data-pais][aria-current="true"] { background: color-mix(in srgb, var(--ctl-on-bg) 12%, transparent); color: var(--ctl-on-bg); }
.unit-list button[data-site][aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); }
/* Delta: interruptor liga/desliga */
.switch { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.switch-track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: color-mix(in srgb, var(--text-soft) 40%, transparent); transition: background-color .18s ease; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.25); transition: transform .18s ease; }
.switch[aria-checked="true"] .switch-track { background: var(--ctl-on-bg); }
.switch[aria-checked="true"] .switch-thumb { transform: translateX(14px); }
@media (prefers-reduced-motion: reduce) { .switch-track, .switch-thumb, .unit-caret { transition: none; } }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 2px; border-radius: 9px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); }
.seg button { min-height: 26px; padding: 2px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.seg button:hover { background: color-mix(in srgb, var(--ctl-on-bg) 12%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); }

/* Painéis */
.dash { flex: 1 1 auto; min-height: 0; margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 32px; }
.panel { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.panel-prod { background: var(--panel); border-radius: 20px; padding: 16px 22px 14px; }
.panel-fin { padding: 16px 4px 14px; }
.panel-head { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.panel-title { margin: 0; font: italic 400 1.18rem var(--font-display); color: var(--text); }
.panel-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; font-size: .74rem; color: var(--text-soft); }
.legend li { display: flex; align-items: center; gap: 7px; }
.swatch { width: 14px; height: 9px; border-radius: 2px; }
.updated { margin: 0; font: italic 400 .7rem var(--font-display); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.demo { font-style: normal; margin-right: 6px; padding: 0 7px; border-radius: 999px; border: 1px solid rgba(245,158,11,.6); color: #B45309; }
:root[data-theme="dark"] .demo { color: #FCD34D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .demo { color: #FCD34D; } }

.panel-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); column-gap: 28px; row-gap: 8px; }
.panel-prod .panel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel-fin .panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
/* Visões de mina: Ontario (uma mina, Production 2×2) e VNL (uma coluna por mina) */
.dash--mina .panel-prod .panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
/* Minas de Ontario (2×2): bloco centralizado na altura, linhas mais próximas e gráficos no centro de cada coluna.
   O mesmo espaçamento nos dois painéis mantém as linhas alinhadas (vence o cálculo de ajustarAltura) */
.dash--mina .panel-grid { align-content: center; justify-items: center; row-gap: clamp(36px, 7vh, 76px) !important; }
.dash--mina .panel .card { width: 100%; max-width: 380px; }
.dash--minas { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.dash--minas .panel .panel-grid { grid-template-columns: minmax(0, 1fr); }
.dash--ir { grid-template-columns: minmax(0, .62fr) minmax(0, 1.38fr); column-gap: 56px; }
/* IR: colunas financeiras largas; cada card na largura do gráfico e centralizado, com o seletor do All-in junto ao título */
.dash--ir .panel-fin .panel-grid { justify-items: center; }
.dash--ir .panel-fin .card { width: 100%; max-width: 380px; }
.dash--ir .panel-prod .panel-grid { grid-template-columns: minmax(0, 1fr); align-content: center; justify-items: center; }
/* IR: os dois gráficos centralizados no painel, na largura máxima do gráfico (título alinhado à barra) */
.dash--ir .panel-prod .card { width: 100%; max-width: 380px; }
/* IR: só dois gráficos no painel; mais ar entre eles (vence o espaçamento comum calculado em ajustarAltura) */
.dash--ir .panel-prod .panel-grid { row-gap: clamp(40px, 8vh, 90px) !important; }
.panel-nota { flex-shrink: 0; margin: 0; font: italic 400 .66rem var(--font-display); color: var(--text-faint); }
.card-title sup { font-size: .6em; margin-left: 1px; }
.panel-sub { font: italic 400 .8rem var(--font-display); color: var(--text-faint); }

/* Indicador: título + unidade, gráfico com altura contida, espaço livre abaixo */
/* Título + gráfico centralizados na faixa da linha: em telas altas a sobra se divide acima e abaixo,
   e o bloco desce em direção à base sem aumentar os gráficos */
.card { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; padding-top: 16px; }
.card-head { flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 8px; }
.card-name { flex: 1 0 auto; max-width: 100%; min-width: 0; }
/* Card com seletor (Cu/Au, All-in…): seletor na linha do título, à direita; sem espaço, o título
   ("All-in | By Product") quebra em duas linhas em vez de empurrar o seletor para baixo */
.card-head:has(.seg) { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; align-items: start; align-content: start; column-gap: 8px; row-gap: 1px; }
.card-head:has(.seg) .card-name { display: contents; }
.card-head:has(.seg) .card-title { grid-area: 1 / 1; white-space: normal; }
.card-head:has(.seg) .seg { grid-area: 1 / 2 / 4 / 3; display: grid; grid-template-columns: repeat(2, auto); } /* 2×2 com 4 opções */
.card-head:has(.seg) .card-unit { grid-area: 2 / 1; }
/* Cabeçalhos com a mesma altura na página (ajustarAltura): os gráficos de uma linha começam na mesma altura */
.card-head { min-height: var(--head-h, 0px); }
.card-title { margin: 0; font: 400 1rem/1.2 var(--font-display); color: var(--chart-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Mesmo arranjo no modo normal e em tela cheia: cada linha tem a altura do conteúdo, a 1ª logo abaixo
   do título do painel e a última junto à base. A altura dos gráficos (--chart-h, até 190 px, sem esticar)
   é calculada em ajustarAltura() para as três linhas caberem no painel */
.panel-grid { grid-template-rows: repeat(var(--rows, 3), auto); align-content: start; row-gap: 10px; }
.card-unit { margin: 1px 0 0; font: 400 .74rem var(--font-display); color: var(--text-faint); }
/* Tela cheia (botão ou F11): sem o cabeçalho azul; tela cheia e tema descem para o canto direito */
.fs-tools { display: flex; align-self: flex-end; gap: 4px; margin-left: 4px; }
.fs-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--text-soft); cursor: pointer; }
.fs-btn:hover { color: var(--accent-strong); border-color: var(--accent-strong); }
.ico-exit { display: none; }
.is-fs .ico-exit { display: block; }
.is-fs .ico-enter { display: none; }
.topnav { display: none; } /* a página abre como na tela cheia, sem a barra azul */
.is-fs .fs-tools { display: flex; }
.page { padding-top: 22px; }
.is-fs .card { justify-content: flex-start; }
@media (display-mode: fullscreen) {
  .topnav { display: none; }
  .fs-tools { display: flex; }
  .page { padding-top: 22px; }
  .card { justify-content: flex-start; }
}
.card .seg button { transition: background-color .18s ease, color .18s ease; }
.card .seg button { min-height: 22px; padding: 1px 8px; font-size: .68rem; }
.chart { flex: none; height: var(--chart-h, 190px); min-height: 56px; position: relative; }
.chart svg { display: block; overflow: visible; font-family: var(--font-display); }

/* SVG */
.b-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.16,.84,.28,1) both; }
.b-bar.neg { transform-origin: 50% 0%; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.b-val { fill: var(--ink-strong); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.b-axis { fill: var(--ink-soft); font-size: 9.5px; }
.b-base { stroke: var(--base-line); }
.b-vazio { fill: var(--text-soft); font: italic 400 15px var(--font-display); }
.b-vazio.is-pend { fill: var(--bad); }
.cota { animation: fade .5s .6s ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.is-static .card:not(.replay) .b-bar, .is-static .card:not(.replay) .cota { animation: none; }
.d-ref { stroke: var(--d-stroke); stroke-dasharray: 3 2; }
.d-now { stroke: var(--d-stroke); }
.d-track { stroke: var(--d-hair); }
.d-pill { fill: var(--pill-bg); stroke: var(--pill-line); filter: drop-shadow(0 2px 6px rgba(15,23,42,.06)); }

    if (matchMedia('(max-width: 1180px), (max-height: 700px)').matches) {

    function maiorCabeca(raiz) {

    // mede os cabeçalhos na altura natural e iguala todos pelo mais alto

    document.documentElement.style.setProperty('--head-h', maiorCabeca(document) + 'px');

    var livre = (gProd.clientHeight - (N - 1) * GAP_MIN) / N - (maiorCabeca(document) + extra);
    var h = Math.max(90, Math.min(MAX_H, Math.floor(livre)));

  // ── Navegação do PDF: BU → minas (VNL: uma página; Ontario: 1/6 a 6/6) e volta para a BU ──

  // ── Dados reais: API do COO Dashboard (coo-api.js), com os valores do PDF como reserva ──
  // De dentro do navegador não dá para saber se a página está no Portal
  // (/VBM-Performance-Hub/COO-Business-Units-Dashboard/) ou num app próprio:
  // tenta os caminhos na ordem e guarda o primeiro que responder.
  var API_BASES = ['api/', '/VBM-Performance-Hub/COO-Business-Units-Dashboard/api/', '/COO-Business-Units-Dashboard/api/', '/api/'];
  var apiBase = null, SITE_ID = null, seqDados = 0;

  function apiGet(recurso) {
    var bases = apiBase ? [apiBase] : API_BASES, i = 0;
    function tentar() {
      if (i >= bases.length) return Promise.reject(new Error('API indisponível'));
      var b = bases[i++];
      return fetch(new URL(recurso, new URL(b, location.href)), { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) {

        })
        .catch(tentar);

  }

  // Nome comparável: sem acento, espaços, pontuação ou maiúsculas
  function normalizar(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ''); }

  // Séries de um card (o próprio card ou cada alternativa: Cu/Au, All-in…), guardando o valor de exemplo
  function series(vs) {
    var lista = [];
    vs.paineis.forEach(function (p) {
      p.cards.forEach(function (c) {
        (c.alt ? Object.keys(c.alt).map(function (k) { return c.alt[k]; }) : [c]).forEach(function (a) {
          if (!('_exemplo' in a)) a._exemplo = a.d;
          lista.push({ alvo: a, nome: a.t || c.t, nomes: [a.kpi, a.t || c.t, a.lbl].filter(Boolean) });
        });
      });
    });
    return lista;
  }

  // Origem dos números, sempre visível: exemplo, parcial (indicador sem dado no banco) ou real
  function marcarFonte(tipo, detalhe, upd) {
    var b = document.getElementById('dataBadge');
    b.hidden = tipo === 'real';
    b.textContent = tipo === 'parcial' ? 'dados parciais' : tipo === 'vazio' ? 'sem dados' : 'dados de exemplo';
    b.title = tipo === 'vazio' ? detalhe : tipo === 'parcial'
      ? 'Sem dado no banco (exibindo o valor de exemplo do PDF): ' + detalhe
      : 'Valores do PDF COO – Business Units Dashboard (Plan, ago/2026).' + (detalhe ? ' ' + detalhe : '');
    document.getElementById('updTxt').textContent = upd || visao().upd;
  }

  function usarExemplo(vs) {
    LETRAS_AF = ['A', 'A', 'F'];
    if (vs.generico) { vs.paineis.forEach(function (p) { p.cards = []; }); return; }
    series(vs).forEach(function (s) { s.alvo.d = s.alvo._exemplo; });
  }

  // Liga cada card ao KPI pelo nome cadastrado em IBP.DASHBOARD.NM_KPIS_DASH
  // (título do card, `kpi` quando o nome no banco for diferente, ou o rótulo da alternativa)
  function aplicarIndicadores(vs, resp) {
    var porNome = {}, letras = ['A', 'A', 'F'], JANELA = { MONTH: 0, QUARTER: 1, YEAR: 2 };
    (resp.linhas || []).forEach(function (l) {
      if (l.LETRA_AF) letras[JANELA[l.CD_VISAO]] = l.LETRA_AF;
      var k = normalizar(l.NM_KPI);
      (porNome[k] = porNome[k] || {})[l.CD_VISAO] = [l.VL_B == null ? null : Number(l.VL_B), l.VL_AF == null ? null : Number(l.VL_AF)];
    });
    var faltando = [], usados = {}, achados = 0;
    series(vs).forEach(function (s) {
      var chave = s.nomes.map(normalizar).filter(function (n) { return porNome[n]; })[0], m = chave && porNome[chave];
      if (m && (m.MONTH || m.QUARTER || m.YEAR)) {
        s.alvo.d = [m.MONTH || [null, null], m.QUARTER || [null, null], m.YEAR || [null, null]];
        usados[chave] = true;
        achados++;
      } else {
        s.alvo.d = s.alvo._exemplo;
        faltando.push(s.nome);
      }
    });
    var sobra = Object.keys(porNome).filter(function (k) { return !usados[k]; });
    if (sobra.length) console.info('[coo-dashboard] KPIs do banco sem card nesta visão:', (resp.linhas || []).filter(function (l) { return sobra.indexOf(normalizar(l.NM_KPI)) >= 0; }).map(function (l) { return l.NM_KPI; }).filter(function (n, i, a) { return a.indexOf(n) === i; }));
    LETRAS_AF = achados ? letras : ['A', 'A', 'F'];

    if (!achados) marcarFonte('exemplo', 'Sem dados no banco para ' + state.bu + ' neste período.');
    else marcarFonte(faltando.length ? 'parcial' : 'real', faltando.join(', '), upd);
  }

  // ── Unidades e filtros a partir do resultado do SQL (/api/filtros) ──
  // País dos sites conhecidos (o SQL não traz país); site novo vai para "Outros"
  var PAIS_DO_SITE = { salobo: 'Brasil', sossego: 'Brasil', oncapuma: 'Brasil', ontario: 'Canadá', vnl: 'Canadá', manitoba: 'Canadá', thompson: 'Canadá',
    longharbour: 'Canadá', internationalrefineries: 'IR', clydach: 'IR', matsusaka: 'IR', matsuzaka: 'IR', sorowako: 'Indonésia' };
  var ORDEM_PAISES = ['Brasil', 'Canadá', 'IR', 'Indonésia', 'Outros'];
  var filtrosPromessa = null;

  // Site do banco sem layout do PDF: cards montados com os KPIs que o SQL trouxer
  function visaoGenerica(nome) {
    return { cls: '', rows: 3, titulo: nome, generico: true, upd: '', paineis: [
      { titulo: 'Production Drivers', cls: 'panel-prod', cards: [] },
      { titulo: 'Financial Drivers', cls: 'panel-fin', cards: [] }
    ] };
  }

  function aplicarFiltros(f) {
    SITE_ID = {};
    var grupos = {};
    (f.sites || []).forEach(function (st) {
      var chave = normalizar(st.nome);
      // nome do site = BU do PDF (Sossego, Ontario…): usa o layout aprovado; senão, layout montado pelos KPIs
      var nome = Object.keys(VISOES).filter(function (k) { return !VISOES[k].pai && normalizar(k) === chave; })[0];
      if (!nome) { nome = st.nome; VISOES[nome] = VISOES[nome] || visaoGenerica(nome); }
      SITE_ID[normalizar(nome)] = st.id;
      var pais = PAIS_DO_SITE[chave] || 'Outros';
      (grupos[pais] = grupos[pais] || []).push(nome);
    });
    var lista = ORDEM_PAISES.filter(function (p) { return grupos[p]; }).map(function (p) { return { pais: p, sites: grupos[p] }; });
    if (!lista.length) throw new Error('O SQL não trouxe nenhum site com dados.');
    UNIDADES = lista;
    if (f.anos && f.anos.length) ANOS = f.anos;
    var ult = f.ultimoRealizado; // abre no último mês realizado (o mesmo corte A/F do SQL)
    if (ult && ANOS.indexOf(ult.ano) >= 0) { state.ano = ult.ano; state.mes = ult.mes; state.tri = Math.ceil(ult.mes / 3); }
    else if (ANOS.indexOf(state.ano) < 0) state.ano = ANOS[ANOS.length - 1];
    var atual = lista.filter(function (u) { return u.sites.indexOf(state.bu) >= 0 && u.pais === state.pais; })[0];
    if (!atual) { state.pais = lista[0].pais; state.bu = lista[0].sites.indexOf('Sossego') >= 0 ? 'Sossego' : lista[0].sites[0]; }
    renderFilters();
  }

  function filtros() {
    if (!filtrosPromessa) {
      filtrosPromessa = apiGet('filtros').then(aplicarFiltros).catch(function (e) { filtrosPromessa = null; throw e; });
    }
    return filtrosPromessa;
  }

  // Monta os cards de um site sem layout do PDF: um card por KPI, na ordem de
  // IBP.DASHBOARD.ID_ORDEM; financeiros pelo nome, o resto em Production Drivers
  var FINANCEIRO = /revenue|receita|cogs|ebitda|capex|cash ?flow|all-?in|by product|sustaining|cost|custo|expense|despesa/i;
  var CUSTO = /cogs|capex|cost|custo|expense|despesa|all-?in|sustaining/i;
  function montarGenerica(vs, resp) {
    var porKpi = {}, ordem = [], JANELA = { MONTH: 0, QUARTER: 1, YEAR: 2 };
    (resp.linhas || []).forEach(function (l) {
      var k = l.ID_OPERACAO + '-' + l.ID_KPI;
      if (!porKpi[k]) { porKpi[k] = { l: l, d: [[null, null], [null, null], [null, null]] }; ordem.push(k); }
      porKpi[k].d[JANELA[l.CD_VISAO]] = [l.VL_B == null ? null : Number(l.VL_B), l.VL_AF == null ? null : Number(l.VL_AF)];
    });
    var prod = [], fin = [];
    ordem.sort(function (a, b) { return (porKpi[a].l.ID_ORDEM || 0) - (porKpi[b].l.ID_ORDEM || 0); }).forEach(function (k) {
      var it = porKpi[k], nome = it.l.NM_KPI || ('KPI ' + it.l.ID_KPI);
      var maior = Math.max.apply(null, [].concat.apply([], it.d).map(function (x) { return Math.abs(x || 0); }));
      var card = { id: 'g-' + k, t: nome, u: '', dec: maior >= 100 ? 0 : maior >= 10 ? 1 : 2, pol: CUSTO.test(nome) ? 'down' : 'up', d: it.d };

  // Busca os indicadores da BU no mês escolhido; só a resposta mais recente é aplicada
  function carregarIndicadores() {
    var meu = ++seqDados, vs = visao(), bu = state.bu;

      return apiGet('indicadores?site=' + id + '&ano=' + state.ano + '&mes=' + state.mes);
    }).then(function (resp) {

        (resp.linhas || []).forEach(function (l) { if (l.LETRA_AF) LETRAS_AF[{ MONTH: 0, QUARTER: 1, YEAR: 2 }[l.CD_VISAO]] = l.LETRA_AF; });
        marcarFonte(n ? 'real' : 'vazio', 'Sem dados no banco para ' + bu + ' neste período.', isNaN(dt) ? null : dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR'));
      } else aplicarIndicadores(vs, resp);

    }).catch(function (e) {

    });
  }

  function atualizar() {
    render();
    carregarIndicadores();
  }

  // ── Eventos ──
  document.querySelector('.filters').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-v]');
    if (!btn) return;
    var k = btn.parentElement.getAttribute('data-filter'), raw = btn.getAttribute('data-v');
    state[k] = isNaN(Number(raw)) ? raw : Number(raw);

  document.addEventListener('click', function (e) {
    var g = e.target.closest('button[data-alt]');
    if (!g) return;

    tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY - 34) + 'px';

    b.addEventListener('click', function () {

  });

  // Tela cheia: alterna; navegadores ou janelas que bloqueiam a API ficam com o F11
  // (o F11 é tratado no CSS por display-mode: fullscreen)
  document.querySelectorAll('.js-full').forEach(function (b) {
    b.addEventListener('click', function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
      } catch (e) { /* sem suporte */ }
    });
  });
  document.addEventListener('fullscreenchange', function () {
    var on = !!document.fullscreenElement;
    document.documentElement.classList.toggle('is-fs', on);
    document.querySelectorAll('.js-full').forEach(function (b) {
      b.setAttribute('aria-label', on ? 'Sair da tela cheia' : 'Tela cheia');
      b.title = on ? 'Sair da tela cheia (Esc)' : 'Tela cheia (F11)';
    });
  });

  renderFilters();
  atualizar();
})();
</script>
</body></html>
