<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>COO Business Units</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap">
<style>
/* Layout: tela única com o ritmo do print original — título editorial em itálico,
   painel cinza de Produção (3×3) e Financeiro solto
   na página (2×3). Gráficos com altura contida e barras estreitas; o espaço
   em branco entre as linhas é parte do desenho. Padrão de séries e cota de
   diferença do VBM Performance Hub. */
:root {
  --page: #FFFFFF;
  --text: #1F2937;
  --text-soft: #6B7280;
  --text-faint: #9CA3AF;
  --line: #E5E7EB;
  --accent: #1E8FC4;          /* títulos grandes (3,9:1 em branco, uso só em ≥24px) */
  --accent-strong: #0B6E99;
  --panel: #F3F4F5;
  --chart-title: #1B7F7B;
  --ink-strong: #111827;
  --ink-soft: #6B7280;
  --base-line: #D1D5DB;
  --pill-bg: #FFFFFF;
  --pill-line: rgba(15,23,42,.06);
  --d-stroke: rgba(116,118,120,.45);
  --d-hair: rgba(116,118,120,.30);
  --badge-bg: rgba(31,41,55,.58);
  --badge-text: #FFFFFF;
  --serie-b: #BCBEC0;
  --serie-a: #3CB5E5;
  --serie-p: #9DB1CF;
  --good: #007E7A;
  --good-bg: rgba(0,126,122,.10);
  --bad: #B91C1C;
  --bad-bg: rgba(220,38,38,.09);
  --flat: #5B5E61;
  --flat-bg: rgba(116,118,120,.12);
  --ctl-bg: #FFFFFF;
  --ctl-border: rgba(13,38,64,.16);
  --ctl-text: #1F2937;
  --ctl-on-bg: #0B6E99;
  --ctl-on-text: #FFFFFF;
  --focus: #0B6E99;
  --nav-bg: linear-gradient(135deg, #041523 0%, #072842 55%, #0b3a64 100%);
  --table-head: #0B6E99;

  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-ui: 'Poppins', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #06192B;
    --text: #E8EEF5;
    --text-soft: rgba(232,238,245,.66);
    --text-faint: rgba(232,238,245,.42);
    --line: rgba(255,255,255,.10);
    --accent: #5CC6EE;
    --accent-strong: #7DD3F0;
    --panel: #0C2438;
    --chart-title: #5FD0C9;
    --ink-strong: #F1F5F9;
    --ink-soft: rgba(241,245,249,.62);
    --base-line: rgba(255,255,255,.22);
    --pill-bg: #0F2C44;
    --pill-line: rgba(255,255,255,.10);
    --d-stroke: rgba(226,232,240,.45);
    --d-hair: rgba(226,232,240,.28);
    --badge-bg: rgba(2,10,20,.55);
    --serie-b: #8E949B;
    --serie-p: #9DB1CF;
    --good: #34C3B8;
    --good-bg: rgba(52,195,184,.14);
    --bad: #F87171;
    --bad-bg: rgba(248,113,113,.14);
    --flat: #B0B5BA;
    --flat-bg: rgba(176,181,186,.14);
    --ctl-bg: rgba(255,255,255,.05);
    --ctl-border: rgba(255,255,255,.16);
    --ctl-text: #E5EDF5;
    --ctl-on-bg: #3CB5E5;
    --ctl-on-text: #02101c;
    --focus: #7DD3F0;
    --table-head: #11577A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #06192B;
  --text: #E8EEF5;
  --text-soft: rgba(232,238,245,.66);
  --text-faint: rgba(232,238,245,.42);
  --line: rgba(255,255,255,.10);
  --accent: #5CC6EE;
  --accent-strong: #7DD3F0;
  --panel: #0C2438;
  --chart-title: #5FD0C9;
  --ink-strong: #F1F5F9;
  --ink-soft: rgba(241,245,249,.62);
  --base-line: rgba(255,255,255,.22);
  --pill-bg: #0F2C44;
  --pill-line: rgba(255,255,255,.10);
  --d-stroke: rgba(226,232,240,.45);
  --d-hair: rgba(226,232,240,.28);
  --badge-bg: rgba(2,10,20,.55);
  --serie-b: #8E949B;
  --serie-p: #9DB1CF;
  --good: #34C3B8;
  --good-bg: rgba(52,195,184,.14);
  --bad: #F87171;
  --bad-bg: rgba(248,113,113,.14);
  --flat: #B0B5BA;
  --flat-bg: rgba(176,181,186,.14);
  --ctl-bg: rgba(255,255,255,.05);
  --ctl-border: rgba(255,255,255,.16);
  --ctl-text: #E5EDF5;
  --ctl-on-bg: #3CB5E5;
  --ctl-on-text: #02101c;
  --focus: #7DD3F0;
  --table-head: #11577A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; min-height: 0;
  background: var(--page); color: var(--text);
  font-family: var(--font-display); font-size: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 110; background: #041523; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ── Página ── */
.page {
  flex: 1 1 auto; min-height: 0; width: 100%;
  padding-block: 12px 16px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

/* Cabeçalho editorial + filtros */
/* Sinal de ciclo (atualização dos dados): âmbar, fora do par verde/vermelho que já indica desempenho */
:root { --wait: #9A5B00; --wait-bg: rgba(217,140,10,.10); --wait-line: rgba(217,140,10,.55); --late: #FFFFFF; --late-bg: #B76A00; --cyc-ok: #1B7F7B; --cyc-shadow: 0 14px 34px rgba(15,23,42,.16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wait: #F5B94A; --wait-bg: rgba(245,185,74,.12); --wait-line: rgba(245,185,74,.55); --late: #1C1203; --late-bg: #F5B94A; --cyc-ok: #5FD0C9; --cyc-shadow: 0 14px 34px rgba(0,0,0,.45); } }
:root[data-theme="dark"] { --wait: #F5B94A; --wait-bg: rgba(245,185,74,.12); --wait-line: rgba(245,185,74,.55); --late: #1C1203; --late-bg: #F5B94A; --cyc-ok: #5FD0C9; --cyc-shadow: 0 14px 34px rgba(0,0,0,.45); }
.cyc-faixa rect { fill: var(--wait-bg); stroke: var(--wait-line); stroke-width: 1; }
.cyc-faixa text { fill: var(--wait); font: italic 500 10.5px var(--font-ui); letter-spacing: .01em; }
.cyc-faixa g { color: var(--wait); }
.cyc-faixa.late rect { fill: var(--late-bg); stroke: none; }
.cyc-faixa.late text { fill: var(--late); }
.cyc-faixa.late g { color: var(--late); }
.cyc-faixa { cursor: default; outline: none; }
.cyc-faixa:focus-visible rect { stroke: var(--focus); stroke-width: 2; }
.cycle:focus-visible, .cyc-item:focus-visible, .cyc-foco:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.b-ghost { fill: url(#hatch-wait); stroke: var(--wait-line); stroke-dasharray: 3 2.5; stroke-width: 1.2; }
.b-ghost-txt { fill: var(--wait); font: 500 10px var(--font-ui); }
.b-stale { opacity: .45; }
.panel-meta { position: relative; }
.cycle { display: inline-flex; align-items: center; gap: 6px; padding: 1px 2px; border: 0; border-radius: 6px; background: transparent; color: var(--text-soft); font: italic 400 .66rem var(--font-ui); cursor: pointer; }
.cycle:hover span:last-child { text-decoration: underline; text-underline-offset: 2px; }
.cycle[aria-expanded="true"] { background: var(--wait-bg); }
.cycle b { font-weight: 500; color: var(--wait); }
.cycle-bar { display: inline-flex; gap: 2px; }
.cycle-bar i { width: 3px; height: 9px; border-radius: 2px; background: var(--cyc-ok); opacity: .85; }
.cycle-bar i.w { background: transparent; border: 1.3px dashed var(--wait); opacity: 1; }
.cycle-bar i.l { background: var(--late-bg); opacity: 1; }
.cycle-ok { font: italic 400 .7rem var(--font-display); color: var(--text-faint); }
.cycle-pop { position: absolute; z-index: 70; top: calc(100% + 6px); right: 0; width: min(400px, calc(100vw - 32px)); max-height: min(60vh, 460px); overflow: auto; padding: 12px 12px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--page); box-shadow: var(--cyc-shadow); text-align: left; }
.cycle-pop h4 { margin: 0 0 2px; font: 500 .84rem var(--font-ui); color: var(--text); }
.cycle-pop > p { margin: 0 0 8px; font-size: .7rem; color: var(--text-soft); }
.cyc-item { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 0 8px; width: 100%; padding: 7px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--text); text-align: left; font: 400 .74rem var(--font-ui); cursor: pointer; }
.cyc-item:hover { background: var(--wait-bg); }
.cyc-item .dot { width: 9px; height: 9px; margin-top: 4px; border-radius: 50%; border: 1.4px dashed var(--wait); }
.cyc-item .dot.l { background: var(--late-bg); border: 0; }
.cyc-item .sub { grid-column: 2; color: var(--text-faint); font-size: .68rem; font-variant-numeric: tabular-nums; }
.cyc-foot { display: flex; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--line); }
.cyc-foco { border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); border-radius: 8px; padding: 4px 10px; font: 500 .7rem var(--font-ui); cursor: pointer; }
.cyc-foco[aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); border-color: transparent; }
.card { transition: opacity .25s, filter .25s; }
.foco-pendentes .card:not(.is-pend) { opacity: .28; filter: grayscale(1); }
.card.cyc-flash { animation: cycflash 1.2s ease-out; }
@keyframes cycflash { 0%, 40% { box-shadow: 0 0 0 3px var(--wait-line); border-radius: 10px; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card.cyc-flash { animation: none; } }
.head { position: relative; flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 32px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.title-block { min-width: 0; margin-bottom: -4px; position: relative; top: -7px; } /* título um pouco acima: centrado entre o topo e a linha do cabeçalho */
.title-block h2 { margin: 0; font: italic 300 clamp(1.7rem, 2.6vw, 2.5rem)/1.05 var(--font-display); color: var(--accent); letter-spacing: -.01em; text-wrap: balance; }
/* Unidade em linha própria (como no print), legenda e atualização alinhadas à direita */
.site-row { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px 24px; flex-wrap: wrap; margin-top: -2px; }
.site-row .panel-meta { position: relative; top: 10px; }
.site-id { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; min-width: 0; }
.site-nav { display: inline-flex; align-items: center; gap: 8px; position: relative; top: 6px; }
.site-nav[hidden] { display: none; }
.pager { display: inline-flex; gap: 4px; }
.nav-chip { min-height: 28px; padding: 2px 12px; border-radius: 999px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.nav-chip:hover:not(:disabled) { border-color: var(--ctl-on-bg); color: var(--ctl-on-bg); }
.nav-chip:disabled { opacity: .4; cursor: default; }
.pager .nav-chip { width: 28px; padding: 0; }
.site { margin: 0; position: relative; top: 4px; font: italic 400 2rem/1.1 var(--font-display); color: var(--accent); letter-spacing: -.005em; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.filter { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.filter-label { font: italic 400 .74rem var(--font-display); color: var(--text-soft); }
/* Unidade: drill-down País → Site */
.unit { position: relative; }
.unit-trigger { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 10px 2px 12px; border-radius: 9px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.unit-trigger:hover, .unit-trigger[aria-expanded="true"] { border-color: var(--ctl-on-bg); }
.unit-pais { color: var(--text-soft); }
.unit-sep { color: var(--text-faint); }
.unit-site { color: var(--ctl-on-bg); font-weight: 600; }
.unit-caret { color: var(--text-soft); transition: transform .18s ease; }
.unit-trigger[aria-expanded="true"] .unit-caret { transform: rotate(180deg); }
.unit-pop { position: absolute; z-index: 60; top: calc(100% + 6px); left: 0; width: 360px; display: grid; grid-template-columns: 1fr 1.15fr; gap: 0; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--page); box-shadow: 0 14px 34px rgba(15,23,42,.16); }
.unit-pop[hidden] { display: none; } /* fechado de verdade também fora do visualizador */
.unit-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 4px; }
.unit-col + .unit-col { border-left: 1px solid var(--line); padding-left: 10px; }
.unit-h { font: 600 .62rem var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); padding: 2px 8px 4px; }
.unit-list { display: flex; flex-direction: column; gap: 2px; }
.unit-list button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ctl-text); font: 500 .76rem var(--font-ui); text-align: left; cursor: pointer; }
.unit-list button:hover { background: color-mix(in srgb, var(--ctl-on-bg) 10%, transparent); }
.unit-list button .n { color: var(--text-faint); font-size: .68rem; }
.unit-list button.sub { justify-content: flex-start; padding: 5px 10px 5px 22px; font-weight: 400; font-size: .72rem; color: var(--text-soft); }
.unit-list button.sub::before { content: '›'; margin-right: 6px; color: var(--text-faint); }
.unit-pop #unitSites { max-height: min(60vh, 420px); overflow-y: auto; }
.unit-list button[data-pais][aria-current="true"] { background: color-mix(in srgb, var(--ctl-on-bg) 12%, transparent); color: var(--ctl-on-bg); }
.unit-list button[data-site][aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); }
/* Delta: interruptor liga/desliga */
.switch { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.switch-track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: color-mix(in srgb, var(--text-soft) 40%, transparent); transition: background-color .18s ease; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.25); transition: transform .18s ease; }
.switch[aria-checked="true"] .switch-track { background: var(--ctl-on-bg); }
.switch[aria-checked="true"] .switch-thumb { transform: translateX(14px); }
@media (prefers-reduced-motion: reduce) { .switch-track, .switch-thumb, .unit-caret { transition: none; } }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 2px; border-radius: 9px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); }
.seg button { min-height: 26px; padding: 2px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap; }
.seg button:hover { background: color-mix(in srgb, var(--ctl-on-bg) 12%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); }

/* Painéis */
.dash { flex: 1 1 auto; min-height: 0; margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 32px; }
.panel { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.panel-prod { background: var(--panel); border-radius: 20px; padding: 16px 22px 14px; }
.panel-fin { padding: 16px 4px 14px; }
.panel-head { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.panel-title { margin: 0; font: italic 400 1.18rem var(--font-display); color: var(--text); }
.panel-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; font-size: .74rem; color: var(--text-soft); }
.legend li { display: flex; align-items: center; gap: 7px; }
.swatch { width: 14px; height: 9px; border-radius: 2px; }
.updated { margin: 0; font: italic 400 .7rem var(--font-display); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.demo { font-style: normal; margin-right: 6px; padding: 0 7px; border-radius: 999px; border: 1px solid rgba(245,158,11,.6); color: #B45309; }
:root[data-theme="dark"] .demo { color: #FCD34D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .demo { color: #FCD34D; } }

.panel-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); column-gap: 28px; row-gap: 8px; }
.panel-prod .panel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel-fin .panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
/* Minas (Production e Financial 2×2): bloco centralizado na altura, linhas mais próximas e gráficos no centro de cada coluna */
.dash--mina .panel-prod .panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.dash--mina .panel-grid { align-content: center; justify-items: center; row-gap: clamp(36px, 7vh, 76px) !important; }
.dash--mina .panel .card { width: 100%; max-width: 380px; }
.dash--ir { grid-template-columns: minmax(0, .62fr) minmax(0, 1.38fr); column-gap: 56px; }
/* IR: colunas financeiras largas; cada card na largura do gráfico e centralizado, com o seletor do All-in junto ao título */
.dash--ir .panel-fin .panel-grid { justify-items: center; }
.dash--ir .panel-fin .card { width: 100%; max-width: 380px; }
.dash--ir .panel-prod .panel-grid { grid-template-columns: minmax(0, 1fr); align-content: center; justify-items: center; }
/* IR: os dois gráficos centralizados no painel, na largura máxima do gráfico (título alinhado à barra) */
.dash--ir .panel-prod .card { width: 100%; max-width: 380px; }
/* IR: só dois gráficos no painel; mais ar entre eles (vence o espaçamento comum calculado em ajustarAltura) */
.dash--ir .panel-prod .panel-grid { row-gap: clamp(40px, 8vh, 90px) !important; }
.panel-vazio { margin: auto; padding: 24px; font: italic 400 .95rem var(--font-display); color: var(--text-soft); text-align: center; }
.panel-sub { font: italic 400 .8rem var(--font-display); color: var(--text-faint); }

/* Indicador: título + unidade, gráfico com altura contida, espaço livre abaixo */
/* Título + gráfico centralizados na faixa da linha: em telas altas a sobra se divide acima e abaixo,
   e o bloco desce em direção à base sem aumentar os gráficos */
.card { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; padding-top: 16px; }
.card-head { flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 8px; }
.card-name { flex: 1 0 auto; max-width: 100%; min-width: 0; }
/* Card com seletor (Cu/Au, All-in…): seletor na linha do título, à direita; sem espaço, o título
   ("All-in | By Product") quebra em duas linhas em vez de empurrar o seletor para baixo */
.card-head:has(.seg) { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; align-items: start; align-content: start; column-gap: 8px; row-gap: 1px; }
.card-head:has(.seg) .card-name { display: contents; }
.card-head:has(.seg) .card-title { grid-area: 1 / 1; white-space: normal; }
.card-head:has(.seg) .seg { grid-area: 1 / 2 / 4 / 3; display: inline-flex; flex-wrap: nowrap; } /* sempre em uma linha */
.card-head:has(.seg) .seg button { min-height: 20px; padding: 1px 6px; font-size: .62rem; }
.card-head:has(.seg) .card-unit { grid-area: 2 / 1; }
/* Cabeçalhos com a mesma altura na página (ajustarAltura): os gráficos de uma linha começam na mesma altura */
.card-head { min-height: var(--head-h, 0px); }
.card-title { margin: 0; font: 400 1rem/1.2 var(--font-display); color: var(--chart-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.panel-grid { grid-template-rows: repeat(var(--rows, 3), auto); align-content: start; row-gap: 10px; }

.fs-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--text-soft); cursor: pointer; }

/* SVG */
.b-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.16,.84,.28,1) both; }
.b-bar.neg { transform-origin: 50% 0%; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.b-val { fill: var(--ink-strong); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.b-axis { fill: var(--ink-soft); font-size: 9.5px; }

.cota { animation: fade .5s .6s ease-out both; }

.is-static .card:not(.replay) .b-bar, .is-static .card:not(.replay) .cota { animation: none; }
.d-ref { stroke: var(--d-stroke); stroke-dasharray: 3 2; }
.d-now { stroke: var(--d-stroke); }
.d-track { stroke: var(--d-hair); }
.d-pill { fill: var(--pill-bg); stroke: var(--pill-line); filter: drop-shadow(0 2px 6px rgba(15,23,42,.06)); }
.d-txt { font-size: 10.5px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }

.is-good .d-txt { fill: var(--good); } .is-good .d-span { stroke: var(--good); } .is-good .d-up { fill: var(--good-bg); } .is-good .d-dn { fill: url(#hatch-good); }
.is-bad .d-txt { fill: var(--bad); } .is-bad .d-span { stroke: var(--bad); } .is-bad .d-up { fill: var(--bad-bg); } .is-bad .d-dn { fill: url(#hatch-bad); }
.is-flat .d-txt { fill: var(--flat); } .is-flat .d-span { stroke: var(--flat); } .is-flat .d-up { fill: var(--flat-bg); } .is-flat .d-dn { fill: url(#hatch-flat); }
.cota .d-ref, .cota .d-now { animation: dline .55s .34s cubic-bezier(.22,.9,.24,1) both; transform-box: fill-box; transform-origin: center; }
.cota .d-span { animation: dspan .55s .48s cubic-bezier(.2,.85,.25,1) both; transform-box: fill-box; transform-origin: 50% 100%; }
.cota .d-pill, .cota .d-txt { animation: dpill .5s .78s cubic-bezier(.2,.85,.25,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes dline { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dspan { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes dpill { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }

:root {

<script>
/* ═══ Setup Dashboards — barra superior + painel de Configurações (padrão VBM Performance Studio / Kaizen) ═══
   Colar num <script> logo depois da marcação (setup-dashboards.html), ANTES do script do dashboard.
   Configuração opcional, declarada antes deste script:
     window.VBM_SETUP = {
       idiomaPadrao: 'pt-BR' | 'en',          // sem escolha salva; padrão 'pt-BR'
       numeroPadrao: 'pt-BR' | 'en-CA',       // sem escolha salva; padrão: pelo idioma do navegador
       urlUsuario: '/api/me'                  // { nome, email, cargo } — rota do Portal (Kaizen)
     };
   Preferências por pessoa no navegador, com as MESMAS chaves do Kaizen e do Studio,
   para valerem em todas as aplicações do Portal: vdt-theme, vdt-lang, vdt-num.
   API para o dashboard (window.VBMSetup):
     t(chave, vars)         texto no idioma atual ('Olá {nome}' + { nome: 'Ana' })
     registrar(dic)         { 'pt-BR': { chave: texto }, en: { … } } — textos do dashboard
     traduzir(raiz?)        aplica data-i18n / -aria / -title / -ph em raiz (padrão: document)
     fmt(valor, casas)      número no formato escolhido (Brasil 1.234,56 · Canadá 1,234.56)
     dataHora(data)         data e hora no idioma escolhido
     on('tema'|'idioma'|'numero', fn)   redesenhar o que o JS monta
     tema / idioma / numero (leitura) */
window.VBMSetup = (function () {
  'use strict';
  var CFG = window.VBM_SETUP || {};
  var CHAVES = { tema: 'vdt-theme', idioma: 'vdt-lang', numero: 'vdt-num' };
  var IDIOMAS = ['pt-BR', 'en'], NUMEROS = ['pt-BR', 'en-CA'];
  var DIC = {
    'pt-BR': { 'sd.menu': 'Menu', 'sd.configuracoes': 'Configurações', 'sd.fechar': 'Fechar', 'sd.tema': 'Tema', 'sd.claro': 'Claro', 'sd.escuro': 'Escuro',
      'sd.idioma': 'Idioma', 'sd.idiomaInfo': 'Idioma da interface', 'sd.numero': 'Formato numérico', 'sd.numeroInfo': 'Separador decimal e de milhar dos gráficos',
      'sd.numeroBR': 'Brasil — 1.234,56', 'sd.numeroCA': 'Canadá — 1,234.56' },
    en: { 'sd.menu': 'Menu', 'sd.configuracoes': 'Settings', 'sd.fechar': 'Close', 'sd.tema': 'Theme', 'sd.claro': 'Light', 'sd.escuro': 'Dark',
      'sd.idioma': 'Language', 'sd.idiomaInfo': 'Interface language', 'sd.numero': 'Number format', 'sd.numeroInfo': 'Decimal and thousands separators in charts',
      'sd.numeroBR': 'Brazil — 1.234,56', 'sd.numeroCA': 'Canada — 1,234.56' }
  };
  var ouvintes = { tema: [], idioma: [], numero: [] };
  function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function gravar(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* só nesta sessão */ } }
  function avisar(evt) { ouvintes[evt].forEach(function (fn) { try { fn(estado[evt]); } catch (e) { console.error('[setup-dashboards]', e); } }); }
  var $ = function (id) { return document.getElementById(id); };

  var estado = {
    tema: ler(CHAVES.tema) === 'dark' ? 'dark' : 'light',
    idioma: IDIOMAS.indexOf(ler(CHAVES.idioma)) >= 0 ? ler(CHAVES.idioma) : (IDIOMAS.indexOf(CFG.idiomaPadrao) >= 0 ? CFG.idiomaPadrao : 'pt-BR'),
    numero: NUMEROS.indexOf(ler(CHAVES.numero)) >= 0 ? ler(CHAVES.numero)
      : NUMEROS.indexOf(CFG.numeroPadrao) >= 0 ? CFG.numeroPadrao : (/^en|^fr/i.test(navigator.language || '') ? 'en-CA' : 'pt-BR')
  };

  function t(chave, vars) {
    var s = (DIC[estado.idioma] || {})[chave];
    if (s == null) s = DIC['pt-BR'][chave];
    if (s == null) return chave;
    return vars ? s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }) : s;
  }
  function registrar(dic) {
    Object.keys(dic || {}).forEach(function (l) { DIC[l] = DIC[l] || {}; for (var k in dic[l]) DIC[l][k] = dic[l][k]; });
  }
  function traduzir(raiz) {
    raiz = raiz || document;
    raiz.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    [['data-i18n-aria', 'aria-label'], ['data-i18n-title', 'title'], ['data-i18n-ph', 'placeholder']].forEach(function (par) {
      raiz.querySelectorAll('[' + par[0] + ']').forEach(function (el) { el.setAttribute(par[1], t(el.getAttribute(par[0]))); });
    });
  }
  function fmt(v, casas) {
    return Number(v).toLocaleString(estado.numero, { minimumFractionDigits: casas, maximumFractionDigits: casas }).replace('-', '−');
  }
  function dataHora(d) {
    var l = estado.idioma === 'en' ? 'en-US' : 'pt-BR';
    return d.toLocaleDateString(l) + ' ' + d.toLocaleTimeString(l);
  }

  // ── Tema: data-bg (barra e painel) + data-theme (tokens do dashboard) ──
  function aplicarTema(tema, salvar) {
    estado.tema = tema === 'dark' ? 'dark' : 'light';
    var html = document.documentElement;
    html.setAttribute('data-bg', estado.tema);
    html.setAttribute('data-theme', estado.tema);
    if ($('btnWhite')) $('btnWhite').classList.toggle('active', estado.tema === 'light');
    if ($('btnBusiness')) $('btnBusiness').classList.toggle('active', estado.tema === 'dark');
    if (salvar) { gravar(CHAVES.tema, estado.tema); avisar('tema'); }
  }
  function aplicarIdioma(l, salvar) {
    estado.idioma = IDIOMAS.indexOf(l) >= 0 ? l : 'pt-BR';
    document.documentElement.lang = estado.idioma;
    if ($('langSelect')) $('langSelect').value = estado.idioma;
    traduzir();
    if (salvar) { gravar(CHAVES.idioma, estado.idioma); avisar('idioma'); }
  }
  function aplicarNumero(n, salvar) {
    estado.numero = NUMEROS.indexOf(n) >= 0 ? n : 'pt-BR';
    if ($('numSelect')) $('numSelect').value = estado.numero;
    if (salvar) { gravar(CHAVES.numero, estado.numero); avisar('numero'); }
  }

  // ── Painel de Configurações (engrenagem) ──
  var btn = $('settingsBtn'), painel = $('settingsPanel'), fundo = $('settingsBackdrop');
  function abrir(sim) {
    if (!painel) return;
    painel.classList.toggle('open', sim); fundo.classList.toggle('open', sim);
    btn.setAttribute('aria-expanded', String(sim)); painel.setAttribute('aria-hidden', String(!sim));
    if (sim) { var f = painel.querySelector('.theme-toggle-btn.active') || painel.querySelector('button'); if (f) f.focus(); } else btn.focus();
  }
  if (btn && painel && fundo) {
    btn.addEventListener('click', function () { abrir(!painel.classList.contains('open')); });
    $('settingsClose').addEventListener('click', function () { abrir(false); });
    fundo.addEventListener('click', function () { abrir(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && painel.classList.contains('open')) abrir(false); });
    $('btnWhite').addEventListener('click', function () { aplicarTema('light', true); });
    $('btnBusiness').addEventListener('click', function () { aplicarTema('dark', true); });
    $('langSelect').addEventListener('change', function (e) { aplicarIdioma(e.target.value, true); });
    $('numSelect').addEventListener('change', function (e) { aplicarNumero(e.target.value, true); });
  }

  // ── Tela cheia: html.is-fs (a barra superior sai de cena pelo CSS) ──
  document.addEventListener('fullscreenchange', function () {
    document.documentElement.classList.toggle('is-fs', !!document.fullscreenElement);
    if (document.fullscreenElement) abrir(false);
  });

  // ── Usuário logado: nome, cargo e iniciais (rota do Portal) ──
  fetch(CFG.urlUsuario || '/api/me', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) {
      if (!me || !$('topnavUser')) return;
      var nome = String(me.nome || me.email || '').trim();
      if (!nome) return;
      var partes = nome.split(/\s+/);
      $('topnavUserName').textContent = nome;
      $('topnavUserRole').textContent = me.cargo || '';
      $('topnavUserAvatar').textContent = ((partes[0] || '')[0] || '') + (partes.length > 1 ? partes[partes.length - 1][0] : '');
      $('topnavUserAvatar').title = nome;
      $('topnavUser').hidden = false;
    })
    .catch(function () { /* sem a rota (ex.: fora do Portal): a barra fica sem o usuário */ });

  aplicarTema(estado.tema, false);
  aplicarNumero(estado.numero, false);
  aplicarIdioma(estado.idioma, false);

  return {
    t: t, registrar: registrar, traduzir: traduzir, fmt: fmt, dataHora: dataHora,
    on: function (evt, fn) { if (ouvintes[evt]) ouvintes[evt].push(fn); },
    get tema() { return estado.tema; }, get idioma() { return estado.idioma; }, get numero() { return estado.numero; }
  };
})();
/* ═══ fim Setup Dashboards ═══ */
</script>

    if (!card) return;
    // Telas estreitas ou baixas: painéis empilhados com altura fixa por linha (CSS). O cálculo abaixo

    if (matchMedia('(max-width: 1180px), (max-height: 700px)').matches) {

    }
    var cs = getComputedStyle(card), GAP_MIN = 10;
    var extra = parseFloat(cs.paddingTop) + (parseFloat(cs.rowGap) || 6);
    function maiorCabeca(raiz) {
      return Math.max.apply(null, [].map.call(raiz.querySelectorAll('.card-head'), function (h) { return h.offsetHeight; }));
    }
    // mede os cabeçalhos na altura natural e iguala todos pelo mais alto
    document.documentElement.style.setProperty('--head-h', '0px');

    var gap = Math.min.apply(null, grids.map(function (g) {

      if (i >= bases.length) return Promise.reject(new Error('API unavailable'));
      var b = bases[i++];
      return fetch(new URL(recurso, new URL(b, location.href)), { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) {
          if (!r.ok) throw new Error(recurso + ' → ' + r.status);
          return r.json().then(function (j) { apiBase = b; return j; });
        })
        .catch(tentar);
    }
    return tentar();
  }

  // Situação dos dados, sempre visível quando não há números: sem conexão ou sem dados no período
  var MSG_PAINEL = 's.consultando', ultimoStatus = null; // painel sem cards (sem conexão ou sem dados)
  // detalhe: função que monta o texto (refeita ao trocar de idioma); upd: Date da consulta
  function marcarStatus(tipo, detalhe, upd) {
    ultimoStatus = [tipo, detalhe, upd];
    if (typeof detalhe === 'function') detalhe = detalhe();
    if (upd instanceof Date) upd = isNaN(upd) ? null : VBMSetup.dataHora(upd);
    var b = document.getElementById('dataBadge');
    MSG_PAINEL = tipo === 'erro' ? 's.semConexao' : tipo === 'carregando' ? 's.consultando' : 's.semIndicadores';
    b.hidden = tipo === 'ok';
    b.textContent = T(tipo === 'erro' ? 'b.erro' : tipo === 'carregando' ? 'b.carregando' : 'b.vazio');
    b.title = detalhe || '';
    document.getElementById('updTxt').textContent = upd || '—';
  }

  // ── Unidades e filtros: sites, anos e mês inicial vêm do resultado da consulta (/api/filtros) ──
  // País (a consulta não traz): IR agrupa as refinarias; Brasil, os sites brasileiros; o resto é Canadá
  var SITES_IR = /^(internationalrefineries|ir|clydach|clydachcnr|matsusaka|matsuzaka|matsusakatonimet)$/;
  // IR no seletor é só "International Refineries"; Clydach | CNR (ID_SITE 16) e Matsusaka (ID_SITE 26)
  // alimentam os cards de produção dela e não aparecem como unidade
  var IR_NOME = 'International Refineries', IR_IDS_FILHOS = [16, 26], IR_FILHOS = [];
  function ehFilhoIR(st) { var n = normalizar(st.nome); return IR_IDS_FILHOS.indexOf(Number(st.id)) >= 0 || /^(clydach|matsusaka|matsuzaka)/.test(n); }
  var SITES_BRASIL = /^(salobo|sossego|oncapuma)$/;
  function paisDo(nome) { var n = normalizar(nome); return SITES_IR.test(n) ? 'IR' : SITES_BRASIL.test(n) ? 'Brazil' : 'Canada'; }
  var ORDEM_PAISES = ['Brazil', 'Canada', 'IR'];
  // Minas de cada BU (navegação do PDF: BU → minas); só entram as que a consulta trouxer como site.
  // Prefixo do nome normalizado: aceita variações como "Copper Cliff Mine" ou "Copper Clif"
  var MINAS_DA_BU = {
    ontario: ['coleman', 'coppercli', 'creighton', 'garson', 'totten', 'stobie'],
    vnl: ['easterndeep', 'reidbrook', 'discoveryhill']
  };
  var MINAS = {}, BU_DA_MINA = {}; // nome da BU → nomes das minas; nome da mina → BU

  function aplicarFiltros(f) {
    var grupos = {}, porChave = {};
    SITE_ID = {}; MINAS = {}; BU_DA_MINA = {};
    // Ordem de apresentação: ID_SITE (BUs, minas e refinarias); a IR sem site próprio vai ao fim
    var porId = (f.sites || []).slice().sort(function (a, b) { return (a.id == null ? Infinity : a.id) - (b.id == null ? Infinity : b.id); });
    IR_FILHOS = porId.filter(ehFilhoIR);
    var sites = porId.filter(function (st) { return !ehFilhoIR(st); });
    // refinarias com dados e sem o site "International Refineries": a IR entra mesmo assim
    if (IR_FILHOS.length && !sites.some(function (st) { return normalizar(st.nome) === normalizar(IR_NOME); })) sites.push({ id: null, nome: IR_NOME });
    sites.forEach(function (st) {
      VISOES[st.nome] = VISOES[st.nome] || criarVisao(st.nome);
      SITE_ID[st.nome] = st.id;
      porChave[normalizar(st.nome)] = st.nome;
    });
    Object.keys(MINAS_DA_BU).forEach(function (bu) {
      if (!porChave[bu]) return;
      var minas = MINAS_DA_BU[bu].map(function (m) {
        var c = Object.keys(porChave).filter(function (n) { return n.indexOf(m) === 0; })[0];
        return c && porChave[c];
      }).filter(Boolean).sort(function (a, b) { return SITE_ID[a] - SITE_ID[b]; });
      if (minas.length) MINAS[porChave[bu]] = minas;
      minas.forEach(function (m) { BU_DA_MINA[m] = porChave[bu]; });
    });
    sites.forEach(function (st) {
      if (BU_DA_MINA[st.nome]) return; // a mina aparece logo abaixo da sua BU
      var pais = paisDo(st.nome);
      (grupos[pais] = grupos[pais] || []).push(st.nome);
    });
    UNIDADES = ORDEM_PAISES.filter(function (p) { return grupos[p]; }).map(function (p) { return { pais: p, sites: grupos[p] }; });
    if (!UNIDADES.length) throw new Error('The query returned no sites with data.');
    ANOS = f.anos && f.anos.length ? f.anos : [state.ano];
    // abre no último mês realizado (o mesmo corte A/F da consulta)
    var ult = f.ultimoRealizado;
    if (ult) { state.ano = ult.ano; state.mes = ult.mes; state.tri = Math.ceil(ult.mes / 3); }
    else if (ANOS.indexOf(state.ano) < 0) state.ano = ANOS[ANOS.length - 1];
    if (URL_INI) { // tela do endereço (refresh ou link), só com valores que a consulta tem
      var u = URL_INI; URL_INI = null;
      if (u.site && u.site in SITE_ID) { state.bu = u.site; state.pais = paisDo(BU_DA_MINA[u.site] || u.site); }
      var mesesDoAno = (f.meses || {})[u.ano];
      if (ANOS.indexOf(u.ano) >= 0 && mesesDoAno && mesesDoAno.indexOf(u.mes) >= 0) { state.ano = u.ano; state.mes = u.mes; state.tri = Math.ceil(u.mes / 3); }
      state.plan = u.plan;
      state.delta = u.delta ? 'on' : 'off';
      document.getElementById('deltaSwitch').setAttribute('aria-checked', String(state.delta === 'on'));
    }
    if (!(state.bu in SITE_ID)) { state.pais = UNIDADES[0].pais; state.bu = UNIDADES[0].sites[0]; }
    renderFilters();
  }

  function filtros() {
    if (!filtrosPromessa) {
      filtrosPromessa = apiGet('filtros').then(aplicarFiltros).catch(function (e) { filtrosPromessa = null; throw e; });
    }
    return filtrosPromessa;
  }

  // ── Preenchimento dos cards com o resultado de /api/indicadores ──
  var JANELA = { MONTH: 0, QUARTER: 1, YEAR: 2 };

  // Site sem modelo próprio: o modelo de BU com mais indicadores em comum com o que o banco trouxe
  function modeloPorKpis(linhas) {
    var nomes = {};
    (linhas || []).forEach(function (l) { nomes[normalizar(l.NM_KPI)] = true; });
    var melhor = null, pontos = 0;
    Object.keys(MODELOS).forEach(function (chave) {
      var m = MODELOS[chave], p = 0;
      m.prod.concat(m.fin).forEach(function (c) {
        (c.alt ? Object.keys(c.alt).map(function (a) { return c.alt[a]; }) : [c]).forEach(function (s) {
          if ([s.t].concat(s.kpi || []).some(function (n) { return nomes[normalizar(n)]; })) p++;
        });
      });
      if (p > pontos) { pontos = p; melhor = m; }
    });
    return melhor;
  }

  // Preenche os indicadores do PDF com o resultado da consulta: nome, unidade e valores do banco.
  // KPIs da consulta fora do PDF não entram na tela.
  // Casas decimais vindas do banco (IBP.DASHBOARD.VL_CASADECIMAL, por KPI); sem valor, o padrão do card
  function casasDe(s, l) {
    if (!('decPdf' in s)) s.decPdf = s.dec;
    return l && l.CASA_DECIMAL != null ? l.CASA_DECIMAL : s.decPdf;
  }

  // Ordem dos gráficos em cada painel: ID_ORDEM da query. A lista do PDF só diz quais gráficos
  // entram e em qual painel; card com seletor usa a menor ordem das suas alternativas; card sem
  // dados vai ao fim, na ordem do PDF
  function ordenarCards(vs) {
    vs.paineis.forEach(function (p) {
      function ordem(c) {
        var os = (c.alt ? Object.keys(c.alt).map(function (a) { return c.alt[a].ordem; }) : [c.ordem]).filter(function (o) { return !isNaN(o); });
        return os.length ? Math.min.apply(null, os) : Infinity;
      }
      var pdf = function (c) { return Number(String(c.id).slice(1)); };
      p.cards.sort(function (a, b) { return (ordem(a) - ordem(b)) || (pdf(a) - pdf(b)); });
    });
  }

  function preencher(vs, linhas, site) {
    if (vs.semModelo && (linhas || []).length) {
      var m = modeloPorKpis(linhas);
      if (m) { var nova = criarVisao(vs.titulo, m); for (var x in nova) vs[x] = nova[x]; vs.semModelo = false; }
    }
    var porKpi = {}, letras = ['A', 'A', 'F'], porNome = {};
    (linhas || []).forEach(function (l) {
      var chave = l.ID_OPERACAO + '-' + l.ID_KPI;
      if (!porKpi[chave]) {
        porKpi[chave] = { l: l, d: [[null, null], [null, null], [null, null]] };
        var n = normalizar(l.NM_KPI);
        (porNome[n] = porNome[n] || []).push(chave);
      }
      porKpi[chave].d[JANELA[l.CD_VISAO]] = [l.VL_B == null ? null : Number(l.VL_B), l.VL_AF == null ? null : Number(l.VL_AF), l.VL_P == null ? null : Number(l.VL_P)];
      if (l.LETRA_AF) letras[JANELA[l.CD_VISAO]] = l.LETRA_AF;
    });
    var usados = {}, achados = 0;
    // Mesmo nome em mais de um KPI do site: o de unidade preferida (`unid`) e, depois, o de menor ID_ORDEM
    function escolher(s) {
      var nomes = [s.t].concat(s.kpi || []), cands = [];
      nomes.forEach(function (n) { (porNome[normalizar(n)] || []).forEach(function (c) { if (!usados[c] && cands.indexOf(c) < 0) cands.push(c); }); });
      cands.sort(function (a, b) {
        var ua = s.unid && s.unid.test(porKpi[a].l.SG_UNID || '') ? 0 : 1, ub = s.unid && s.unid.test(porKpi[b].l.SG_UNID || '') ? 0 : 1;
        return (ua - ub) || ((porKpi[a].l.ID_ORDEM || 0) - (porKpi[b].l.ID_ORDEM || 0));
      });
      return cands[0] || null;
    }
    function aplicar(s, chave) {
      if (!chave) { s.d = null; s.t = s.tPdf; s.u = ''; s.dec = casasDe(s, null); s.atual = null; s.ref = null; s.ordem = NaN; return; }
      usados[chave] = true; achados++;
      var l = porKpi[chave].l, nome = String(l.NM_KPI).trim();
      s.d = porKpi[chave].d;
      s.dec = casasDe(s, l);
      s.atual = null; s.ref = site ? site + '|' + l.ID_OPERACAO + '|' + l.ID_KPI : null; // situação do ciclo: carregarAtualizacao
      s.t = nome; // nome do gráfico como vem da query
      s.ordem = Number(l.ID_ORDEM); // ordem de apresentação (ordenarCards)
      s.u = l.SG_UNID || '';
    }
    // Indicadores do PDF na ordem do PDF (Production e depois Financial; alternativas do seletor em sequência)
    var seq = [];
    vs.paineis.forEach(function (p) {
      p.cards.forEach(function (c) {
        (c.alt ? Object.keys(c.alt).map(function (a) { return c.alt[a]; }) : [c]).forEach(function (s) {
          if (!s.tPdf) s.tPdf = s.t;
          if (s.filho) return; // lido de outro site (refinarias da IR): preencherFilhos
          var chave = escolher({ t: s.tPdf, kpi: s.kpi, unid: s.unid });
          if (chave) usados[chave] = true;
          seq.push({ s: s, chave: chave });
        });
      });
    });
    // Nome sem correspondência: ID_ORDEM, a ordem de apresentação do banco. Entre dois
    // indicadores reconhecidos pelo nome (âncoras), os KPIs do banco com ID_ORDEM no
    // intervalo ocupam, na mesma ordem, os cards do PDF que ficaram sem par. Só quando
    // o número de KPIs no intervalo é igual ao de cards; senão o card fica "Sem dados".
    var ordemDe = function (c) { return Number(porKpi[c].l.ID_ORDEM); };
    (function () {
      var i = 0;
      while (i < seq.length) {
        if (seq[i].chave) { i++; continue; }
        var j = i;
        while (j < seq.length && !seq[j].chave) j++;
        var antes = i > 0 ? ordemDe(seq[i - 1].chave) : null, depois = j < seq.length ? ordemDe(seq[j].chave) : null;
        if (antes !== null || depois !== null) {
          var cands = Object.keys(porKpi).filter(function (c) {
            var o = ordemDe(c);
            return !usados[c] && !isNaN(o) && (antes === null || o > antes) && (depois === null || o < depois);
          }).sort(function (a, b) { return ordemDe(a) - ordemDe(b); });
          if (cands.length === j - i) {
            cands.forEach(function (c, n) { seq[i + n].chave = c; usados[c] = true; });
          } else if (cands.length) {
            console.info('[coo-dashboard] ' + vs.titulo + ': no name match for ' + seq.slice(i, j).map(function (it) { return it.s.tPdf; }).join(', ') +
              ' — database KPIs with ID_ORDEM in the range: ' + cands.map(function (c) { return porKpi[c].l.NM_KPI + ' (' + ordemDe(c) + ')'; }).join(', '));
          }
        }
        i = j;
      }
    })();
    usados = {};
    seq.forEach(function (it) { aplicar(it.s, it.chave); });
    vs.paineis.forEach(function (p) {
      p.cards.forEach(function (c) { if (c.alt) { var a0 = c.alt[Object.keys(c.alt)[0]]; c.t = a0.t; c.u = a0.u; } });
    });
    LETRAS_AF = letras;
    return achados;
  }

  // Cards lidos de outro site (produção de cada refinaria na IR): o KPI de mesmo nome,
  // senão o de produção, senão o primeiro pelo ID_ORDEM. Devolve quantos têm dados.
  function preencherFilhos(vs, respostas) {
    var achados = 0;
    vs.paineis.forEach(function (p) {
      p.cards.forEach(function (s) {
        if (!s.filho) return;
        if (!s.tPdf) s.tPdf = s.t;
        var r = respostas.filter(function (x) { return normalizar(x.nome).indexOf(s.filho) === 0; })[0];
        var porKpi = {}, ordem = [];
        ((r && r.linhas) || []).forEach(function (l) {
          var chave = l.ID_OPERACAO + '-' + l.ID_KPI;
          if (!porKpi[chave]) { porKpi[chave] = { l: l, d: [[null, null], [null, null], [null, null]] }; ordem.push(chave); }
          porKpi[chave].d[JANELA[l.CD_VISAO]] = [l.VL_B == null ? null : Number(l.VL_B), l.VL_AF == null ? null : Number(l.VL_AF), l.VL_P == null ? null : Number(l.VL_P)];
        });
        ordem.sort(function (a, b) { return (porKpi[a].l.ID_ORDEM || 0) - (porKpi[b].l.ID_ORDEM || 0); });
        var nomes = [s.tPdf].concat(s.kpi || []).map(normalizar);
        var chave = ordem.filter(function (c) { return nomes.indexOf(normalizar(porKpi[c].l.NM_KPI)) >= 0; })[0] ||
          ordem.filter(function (c) { return /prod/i.test(porKpi[c].l.NM_KPI || ''); })[0] || ordem[0];
        if (!chave) { s.d = null; s.t = s.tPdf; s.u = ''; s.dec = casasDe(s, null); s.atual = null; s.ref = null; s.ordem = NaN; return; }
        var l = porKpi[chave].l, nome = String(l.NM_KPI).trim();
        s.d = porKpi[chave].d;
        s.dec = casasDe(s, l);
        s.atual = null; s.ref = r.site ? r.site + '|' + l.ID_OPERACAO + '|' + l.ID_KPI : null;
        s.t = nome; // nome do gráfico como vem da query
        s.ordem = Number(l.ID_ORDEM);
        s.u = l.SG_UNID || '';
        achados++;
      });
    });
    return achados;
  }

  // Busca os indicadores do site no mês escolhido; só a resposta mais recente é aplicada
  function carregarIndicadores() {
    var meu = ++seqDados;
    marcarStatus('carregando', function () { return T('s.consultando'); });
    filtros().then(function () {
      if (meu !== seqDados) return null;
      render(); // os filtros podem ter definido o site e o mês iniciais
      var periodo = '&ano=' + state.ano + '&mes=' + state.mes, id = SITE_ID[state.bu];
      var filhos = normalizar(state.bu) === normalizar(IR_NOME) ? IR_FILHOS : [];
      return Promise.all([id ? apiGet('indicadores?site=' + id + periodo) : { linhas: [], geradoEm: new Date().toISOString() }].concat(
        filhos.map(function (f) { return apiGet('indicadores?site=' + f.id + periodo).then(function (r) { r.nome = f.nome; return r; }); })));
    }).then(function (todas) {
      if (!todas || meu !== seqDados) return;
      var resp = todas[0], vs = visao(), n = preencher(vs, resp.linhas, resp.site) + preencherFilhos(vs, todas.slice(1)), dt = new Date(resp.geradoEm);
      ordenarCards(vs);
      var bu = state.bu, mes = state.mes - 1, ano = state.ano;
      if (n) marcarStatus('ok', '', dt);
      else marcarStatus('vazio', function () { return T('s.semValores', { bu: bu, mes: mesLongo(mes), ano: ano }); }, dt);
      render();
      if (n) carregarAtualizacao(meu, [resp.site].concat(todas.slice(1).map(function (r) { return r.site; })));
    }).catch(function (e) {
      if (meu !== seqDados) return;
      preencher(visao(), []);
      preencherFilhos(visao(), []);
      var msg = e.message;
      marcarStatus('erro', function () { return T('s.erro', { msg: msg }); });
      render();
    });
  }

  // Situação da atualização do ciclo (consulta à parte): chega depois dos gráficos e só acrescenta
  // o aviso; se falhar ou demorar, os gráficos continuam como estão
  function carregarAtualizacao(meu, sites) {
    var periodo = '&ano=' + state.ano + '&mes=' + state.mes;
    Promise.all(sites.filter(Boolean).map(function (id) {
      return apiGet('atualizacao?site=' + id + periodo).catch(function (e) { console.warn('[coo-dashboard] update status unavailable:', e.message); return null; });
    })).then(function (resps) {
      if (meu !== seqDados) return;
      var mapa = {};
      resps.forEach(function (r) { if (r && r.kpis) Object.keys(r.kpis).forEach(function (k) { mapa[r.site + '|' + k] = r.kpis[k]; }); });
      if (!Object.keys(mapa).length) return;
      visao().paineis.forEach(function (p) {
        p.cards.forEach(function (c) {
          (c.alt ? Object.keys(c.alt).map(function (a) { return c.alt[a]; }) : [c]).forEach(function (s) { s.atual = s.ref ? mapa[s.ref] || null : null; });
        });
      });
      render();
    });
  }

  function atualizar() {
    render();
    carregarIndicadores();
  }

  // ── Eventos ──
  document.querySelector('.filters').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-v]');
    if (!btn) return;
    var k = btn.parentElement.getAttribute('data-filter'), raw = btn.getAttribute('data-v');
    if (k === 'visao') { // Plan: liga/desliga a barra do Plan (Supply) no mês; não refaz a consulta
      state.plan = !state.plan;
      renderFilters();
      render();
      return;
    }
    state[k] = isNaN(Number(raw)) ? raw : Number(raw);
    if (k === 'tri') state.mes = (state.tri - 1) * 3 + 3; // cascata: último mês do trimestre
    renderFilters();
    atualizar();
  });

  document.addEventListener('click', function (e) {
    var g = e.target.closest('button[data-alt]');
    if (!g) return;
    var id = g.getAttribute('data-for'), k = g.getAttribute('data-alt');
    if (state.sel[id] === k) return;
    state.sel[id] = k;
    var tmp = document.createElement('div');
    tmp.innerHTML = cardHtml(byId(id));
    var card = tmp.firstChild;
    card.classList.add('replay');
    document.getElementById('card-' + id).replaceWith(card);
    renderCiclo(); // a alternativa escolhida pode ter outra situação de atualização
    ajustarAltura(); // o novo título pode mudar a altura do cabeçalho
    observeCharts();
    setTimeout(function () { card.classList.remove('replay'); }, 1500);
    var btn = card.querySelector('button[data-alt="' + k + '"]');
    if (btn) btn.focus();
  });

  var tip = document.getElementById('tip');
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY - 34) + 'px';
  });

  // Tela cheia: alterna; navegadores ou janelas que bloqueiam a API ficam com o F11
  // (o F11 é tratado no CSS por display-mode: fullscreen)
  document.querySelectorAll('.js-full').forEach(function (b) {
    b.addEventListener('click', function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
      } catch (e) { /* sem suporte */ }
    });
  });
  document.addEventListener('fullscreenchange', function () {
    var on = !!document.fullscreenElement;
    document.documentElement.classList.toggle('is-fs', on);
    document.querySelectorAll('.js-full').forEach(function (b) {
      b.setAttribute('aria-label', T(on ? 'fs.off' : 'fs.on'));
      b.title = T(on ? 'fs.offTitle' : 'fs.onTitle');
    });
  });

  VBMSetup.on('idioma', function () {
    renderFilters();
    if (ultimoStatus) marcarStatus.apply(null, ultimoStatus);
    if (!unitPop.hidden) renderUnit();
    var fs = !!document.fullscreenElement;
    document.querySelectorAll('.js-full').forEach(function (b) { b.setAttribute('aria-label', T(fs ? 'fs.off' : 'fs.on')); b.title = T(fs ? 'fs.offTitle' : 'fs.onTitle'); });
    render();
  });
  VBMSetup.on('numero', function () { render(); });
  VBMSetup.on('tema', function () { render(); });

  renderFilters();
  atualizar();
})();
</script>
</body></html>
