  ═══════════════════════════════════════════════════════════════════
  VBM KAIZEN · Dashboard (porta de entrada)
  ═══════════════════════════════════════════════════════════════════
  PAPEL DA PÁGINA
    Tela inicial: hero em tela cheia + navegação para as demais telas.
    Autenticação Microsoft (MSAL) fica aqui — ver bloco no fim do arquivo.

  DEPENDÊNCIAS (carregadas no <head> / fim do <body>)
    • Font Awesome 6  — ícones (fa-solid ...)
    • css/vbm-app.css — Design System VBM: tokens (--vbm-*), reset,
      componentes compartilhados (.btn, .form-control, .modal, .badge...)
    • js/vbm-app.js  — comportamento compartilhado: modais, abas,
      wizard, filtros, toasts, toggles. Auto-inicializa no DOMContentLoaded.
    NÃO usa jQuery, Bootstrap nem AOS — foram removidos por não terem
    uso real (economia de ~446 KB por página).

  ORGANIZAÇÃO DESTE ARQUIVO
    1. <style> local .... overrides desta tela apenas. O que for
                          reutilizável deve ir para vbm-app.css.
    2. <body> .......... topnav → painel de configurações → conteúdo
    3. <script> ........ blocos IIFE independentes, um por recurso

  TEMA CLARO/ESCURO
    Alternado por body[data-bg="dark"] (persistido em localStorage
    'vdt-theme'). Toda regra de cor precisa do par claro + escuro.

  INTERNACIONALIZAÇÃO (i18n)
    Marque o elemento com data-i18n / -title / -aria / -placeholder e
    cadastre a chave nos DOIS dicionários (pt-BR e en) no fim do arquivo.
    Idioma persistido em localStorage 'vdt-lang'.
    Esta página tem dicionário enxuto: só as chaves do topnav e do
    painel de configurações.
  ═══════════════════════════════════════════════════════════════════
-->

/* ═══════════════════════════════════════════════════
   TOPNAV LAYOUT OVERRIDE
   Removes sidebar dependency; uses full-width top bar
═══════════════════════════════════════════════════ */

/* Reset sidebar-based layout */
.app-layout { display: block; }
.app-main   { margin-left: 0; }

/* Altura exata da tela, sem barra de rolagem.
   O topnav (64px) é irmão do .app-layout e vem ANTES dele no fluxo, então
   a página inteira mede 64px + altura do .app-layout. O vbm-app.css manda
   `min-height: 100svh` nos dois (regra pensada para as telas com sidebar),
   o que garantia 64px de sobra e a barra de rolagem aparecia em QUALQUER
   tamanho de tela. Aqui o piso de altura desconta o topnav. A
   especificidade é a mesma do vbm-app.css — vence por vir depois na ordem
   das folhas, sem precisar de !important nem mexer no arquivo comum. */
div.app-layout, main.app-main { min-height: calc(100vh - 64px); }

/* Os outros 28px de sobra vinham do padding inferior do .page-content: a
   margem negativa da hero anula só o padding de cima (mais o topnav), e a
   hero já alcança a base da viewport por conta própria. Nesta tela o
   .page-content não tem nada além da hero, então o respiro de baixo não
   cumpre função — sem ele a conta fecha em 100% da altura visível. */
.page-content { padding-bottom: 0; }

/* Hero full-bleed — estoura o padding lateral/superior do .page-content
   (1.75rem) para cobrir 100% da largura e altura da viewport, subindo
   por trás do topnav (sticky, 64px) para que o vidro do menu mostre a
   própria imagem da hero em vez do fundo da página. */
/* Horizontal continua recortado (o zoom da arte estoura de propósito).
   O vertical passa a ceder: com o celular deitado (390px de altura) o
   conteúdo mede 454px e os últimos 64px ficavam inalcançáveis, porque
   overflow:hidden travava a rolagem. Quando tudo cabe — o caso normal
   em desktop — nada muda: não há o que rolar. */
html, body { overflow-x: clip; overflow-y: auto; }
@supports not (overflow-x: clip) { html, body { overflow-x: hidden; } }

.dash-hero {
  width: calc(100% + 3.5rem);
  margin-top: calc(-1.75rem - 64px);
  margin-left: -1.75rem;
  margin-right: 0;
  /* O vbm-app.css dá 1.75rem de margem embaixo da hero para separá-la dos
     cards que vêm a seguir. Aqui a hero é o único conteúdo da tela e
     termina na base da viewport — a margem só sobrava como rolagem. */
  margin-bottom: 0;
  border-radius: 0;
  height: 100vh;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}
/* Em telas ≤768px o .page-content passa a usar padding de 1rem (regra do
   vbm-app.css). Sem reajustar estes cálculos, a hero ficava 1,5rem mais
   larga que a área útil e deslocada para a direita. */
@media (max-width: 768px) {
  .dash-hero {
    width: calc(100% + 2rem);
    margin-top: calc(-1rem - 64px);
    margin-left: -1rem;
  }
}
/* Em celulares, 100vh ignora a barra do navegador e corta a arte;
   100dvh acompanha a altura realmente visível. O piso do layout acompanha
   a mesma unidade da hero: se um usasse dvh e o outro vh, a diferença
   entre as duas medidas viraria sobra — e barra de rolagem de novo. */
@supports (height: 100dvh) {
  .dash-hero { height: 100dvh; min-height: 100dvh; }
  div.app-layout, main.app-main { min-height: calc(100dvh - 64px); }
}

/* Arte da hero (sem o texto, que agora é DOM — ver o <svg> no corpo da
   página). O zoom-in lento saiu da imagem e foi para o wrapper: assim
   arte e texto crescem juntos, movidos pela MESMA animação, sem chance
   de um começar antes do outro e o texto descolar do desenho. */
.dash-hero-zoom {
  position: absolute; inset: 0;
  animation: heroZoomIn 20s linear infinite alternate;
}
.dash-hero-bg-img {
  opacity: 1;
  mix-blend-mode: normal;
  object-fit: cover;
  object-position: left bottom;
  /* O vbm-app.css dá a esta classe um `animation: pulse` (respira entre
     scale 1.02 e 1, com a opacidade indo a .85). Antes ele era anulado
     porque a própria imagem carregava o heroZoomIn; agora que o zoom
     mudou para o wrapper, é preciso desligar o pulse explicitamente —
     senão a arte pulsa sozinha e sai do lugar em relação ao texto. */
  animation: none;
}
@keyframes heroZoomIn {
  from { transform: scale(1); }
  to   { transform: scale(1.08); }
}
/* Quem pediu menos animação no sistema não recebe o zoom — a arte fica
   parada, e parada ela continua correta. */
@media (prefers-reduced-motion: reduce) {
  .dash-hero-zoom { animation: none; }
}

/* ── Texto da hero ──────────────────────────────────────────────────
   Fica por cima da arte, no mesmo recorte (ver preserveAspectRatio no
   HTML). pointer-events:none para não roubar o clique de nada. */
.dash-hero-texto {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
/* As duas fontes vinham embutidas DENTRO do SVG da hero (1,35 MB de
   base64 em fonte variável completa). Como o texto saiu de lá, elas
   passam a ser carregadas aqui — só com os caracteres realmente usados
   nos dois idiomas, e já fixadas no peso em que eram desenhadas

   o mesmo desenho de letra. O peso declarado no @font-face tem de bater

/* ── Posição do bloco de texto (06/10/2026) ─────────────────────────
   Com o símbolo VPS fora da arte, o bloco sobe para o centro da área
   abaixo do menu e cresce 10% (mesma conta do atributo transform no
   <g class="hero-bloco"> do HTML, que fica de reserva). Em SVG, px no
   CSS = unidade do viewBox (2400×1145) e a origem é 0 0, então:
   translate(esquerda, topo) scale(s) translate(-169, -485), onde
   (169,485) é o canto superior esquerdo do bloco no desenho original.
   O bloco mede ~710×515 unidades em escala 1.

   Em tela de pé (celular, tablet em retrato) a arte é encaixada pela
   ALTURA e só ~1145×(largura/altura) unidades de largura ficam
   visíveis — 529 num celular de 390×844. O bloco não cabia (era
   cortado no meio de "Pessoas." mesmo antes desta revisão). Cada degrau
   abaixo escolhe escala e margem para o bloco caber inteiro na faixa
   visível daquela proporção, sempre centrado na altura (centro 615). */
.hero-bloco { transform: translate(169px, 332px) scale(1.1) translate(-169px, -485px); }
@media (max-aspect-ratio: 1/1)  { .hero-bloco { transform: translate(90px, 370px) scale(.95) translate(-169px, -485px); } }
@media (max-aspect-ratio: 3/4)  { .hero-bloco { transform: translate(70px, 409px) scale(.8)  translate(-169px, -485px); } }
@media (max-aspect-ratio: 9/16) { .hero-bloco { transform: translate(45px, 455px) scale(.62) translate(-169px, -485px); } }
@media (max-aspect-ratio: 9/20) { .hero-bloco { transform: translate(35px, 486px) scale(.5)  translate(-169px, -485px); } }

/* Acima de 1920px o vbm-app.css limita o .page-content a 1800px e o
   centraliza. A hero desta tela é de ponta a ponta (full-bleed): aqui o
   limite não se aplica, senão a arte ficaria numa faixa no meio. */
@media (min-width: 1921px) {
  .page-content { max-width: none; }
}

/* ── Top Navigation Bar — replicado 1:1 de Referencias/Value Drive Tree/style.css (.topbar) ── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 64px;
  background: transparent;
  display: flex;
  align-items: center;
  padding: 0 2rem;
  gap: 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  box-shadow: none;
  transition: background .3s var(--ease-out), box-shadow .3s var(--ease-out), border-color .3s var(--ease-out);
}
@supports (backdrop-filter: blur(1px)) {
  .topnav { backdrop-filter: blur(4px) saturate(120%); -webkit-backdrop-filter: blur(4px) saturate(120%); }
}
/* Vidro no topo; azul sólido só depois de rolar a página */
.topnav.scrolled {
  background: var(--vbm-blue);
  box-shadow: 0 2px 20px rgba(13,38,64,.18);
}

/* ── Logo ── */
.topnav-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  margin-right: 1.5rem;
  position: relative; z-index: 1;
}
.topnav-logo img { height: 26px; width: auto; filter: brightness(10); }

/* ── Nav Links ── */
.topnav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .15rem;
  flex: 1;
  position: relative; z-index: 1;
}

.topnav-link {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .5rem .85rem;
  border-radius: .45rem;
  font-family:'Poppins', sans-serif;font-weight:400;
  font-size: .72rem;
  letter-spacing: .04em;
  color: rgba(255,255,255,.75);
  text-decoration: none;
  white-space: nowrap;
  transition: color .18s;
  position: relative;
}
.topnav-link i { font-size: .72rem; }
.topnav-link:hover { color: #fff; }
.topnav-link.active {
  color: #fff;
}
.topnav-link::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 50%;
  width: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, #fff 25%, #fff 75%, transparent);
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(255,255,255,.65);
  opacity: 0;
  transform: translateX(-50%);
  transition: width .3s var(--ease-out), opacity .3s var(--ease-out);
}
.topnav-link.active::after {
  width: 60%;
  opacity: 1;
}
.topnav-link:not(.active):hover::after {
  width: 30%;
  opacity: .4;
}

/* Badge on link */
.topnav-badge {
  font-size: .55rem;
  padding: .1rem .35rem;
  border-radius: 10rem;
  background: #c2770e;
  color: #fff;
  font-family:'Poppins', sans-serif;font-weight:700;
  line-height: 1.4;
}

/* ── Section divider in links ── */
.topnav-sep {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,.25);
  flex-shrink: 0;
  margin: 0 .1rem;
}

/* ── Right actions ── */
.topnav-actions {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-shrink: 0;
  margin-left: auto;
  position: relative; z-index: 1;
}

/* User chip — tamanhos/cores 1:1 de Referencias/Value Drive Tree/style.css (.user-chip) */
.topnav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 10px;
  border-left: 1px solid rgba(255,255,255,.22);
  flex-shrink: 0;
}
.topnav-user-text {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.3;
}
.topnav-user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--vbm-blue-light), var(--vbm-blue-dark));
  border: 1.5px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-family:'Poppins', sans-serif;font-weight:700;
  font-size: 11px;
  color: #fff;
  flex-shrink: 0;
}
.topnav-user-name {
  font-family:'Poppins', sans-serif;font-weight:600;
  font-size: 11.5px;
  color: #fff;
  white-space: nowrap;
}
.topnav-user-role {
  font-family:'Poppins', sans-serif;font-weight:600;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.6);
  white-space: nowrap;
}

/* ── Mobile hamburger ── */
.topnav-mobile-toggle {
  display: none;
  width: 34px; height: 34px;
  border-radius: .4rem;
  border: none;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.7);
  align-items: center; justify-content: center;
  font-size: .85rem;
  cursor: pointer;
  flex-shrink: 0;
}

/* Mobile drawer */
.topnav-drawer {
  display: none;
  position: fixed;
  top: 64px; left: 0; right: 0;
  background: #020e1c;
  border-bottom: 1px solid rgba(60,181,229,.15);
  z-index: 299;
  padding: .75rem 1rem;
  flex-direction: column;
  gap: .25rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.topnav-drawer.open { display: flex; }
.topnav-drawer .topnav-link { font-size: .8rem; padding: .65rem .9rem; }

/* ── Responsive ── */
@media (max-width: 960px) {
  .topnav-links { display: none; }
  .topnav-mobile-toggle { display: flex; }
  .topnav-user-role { display: none; }
}
@media (max-width: 540px) {
  .topnav-user-name { display: none; }
}

/* ═══════════════════════════════════════════════════
   SETTINGS (engrenagem) — replicado 1:1 de
   Referencias/Value Drive Tree/style.css
═══════════════════════════════════════════════════ */

/* ── Botão de engrenagem (abre o painel de configurações) ── */
.settings-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  padding: 0;
  border: none;
  border-radius: 100px;
  background: transparent;
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .25s, transform .35s var(--ease-spring);
}
.settings-btn:hover { background: rgba(255,255,255,.12); }
.settings-btn[aria-expanded="true"] {
  background: rgba(255,255,255,.18);
  transform: rotate(50deg);
}

/* ════════════════════════════════════════════════════════════
   PAINEL LATERAL DE CONFIGURAÇÕES (Theme + Language)
   ════════════════════════════════════════════════════════════ */
.settings-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  z-index: 399;
  transition: opacity .3s var(--ease-out);
}
.settings-backdrop.open { opacity: 1; pointer-events: auto; }

.settings-panel {
  position: fixed;
  top: 0; right: 0;
  width: 300px;
  max-width: 90vw;
  height: 100vh;
  background: #fff;
  box-shadow: -16px 0 48px rgba(9,20,34,.22);
  z-index: 400;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .38s var(--ease-out);
}
.settings-panel.open { transform: translateX(0); }

.settings-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #eef1f6;
}
.settings-panel-head h2 {
  font-family:'Poppins', sans-serif;font-weight:700;
  font-size: .92rem;
  letter-spacing: -.01em;
  color: var(--vbm-dark);
}
.settings-close {
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  border: none;
  border-radius: 100px;
  background: #fafcfe;
  color: var(--vbm-mid);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.settings-close svg { width: 11px; height: 11px; }
.settings-close:hover { background: var(--vbm-blue); color: #fff; }

.settings-panel-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.settings-section { display: flex; flex-direction: column; gap: 9px; }
.settings-section-title {
  display: flex; align-items: center; gap: 5px;
  font-family:'Poppins', sans-serif;font-weight:600;
  font-size: 11px;
  color: var(--vbm-dark);
}
.settings-info {
  display: inline-flex; align-items: center; justify-content: center;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid #e8e8e8;
  color: var(--vbm-mid);
  font-size: 8px;
  font-style: italic;
  font-family: Georgia, serif;
  cursor: help;
}

.settings-divider {
  height: 1px;
  background: #eef1f6;
  margin: 18px 0;
}

/* Theme — segmentado Claro / Escuro */
.theme-toggle {
  display: flex; align-items: center;
  background: #fafcfe;
  border: 1px solid #e8e8e8;
  border-radius: 100px;
  padding: .16rem; gap: .1rem;
  width: fit-content;
}
.theme-toggle-btn {
  padding: .38rem 1.05rem; border-radius: 100px;
  font-size: .64rem; letter-spacing: .02em;
  color: var(--vbm-mid); border: none; background: transparent;
  cursor: pointer; font-family:'Poppins', sans-serif;font-weight:600;
  transition: background .2s, color .2s; white-space: nowrap; line-height: 1;
}
.theme-toggle-btn.active {
  background: var(--vbm-blue); color: #fff;
  box-shadow: 0 4px 14px rgba(60,181,229,.35);
}

/* Language — select nativo com aparência custom (borda + chevron) */
.settings-select-wrap { position: relative; }
.settings-select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: #fff;
  border: 1.5px solid #e8e8e8;
  border-radius: 9px;
  padding: .5rem 1.9rem .5rem .75rem;
  font-family:'Poppins', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--vbm-dark);
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s;
}
.settings-select:hover { border-color: var(--vbm-blue-light); }
.settings-select:focus {
  outline: none;
  border-color: var(--vbm-blue);
  box-shadow: 0 0 0 3px rgba(60,181,229,.15);
}
.settings-select-caret {
  width: 9px; height: 9px;
  position: absolute;
  right: .75rem; top: 50%;
  transform: translateY(-50%);
  color: var(--vbm-mid);
  pointer-events: none;
}

/* Transições suaves ao alternar tema */
.settings-panel, .settings-panel-head, .settings-panel-head h2,
.settings-close, .settings-section-title, .settings-info,
.settings-divider, .theme-toggle, .theme-toggle-btn,
.settings-select, .settings-select-caret, .settings-backdrop {
  transition-property: background, background-color, border-color, color, box-shadow, opacity, transform;
  transition-duration: .25s, .25s, .25s, .25s, .25s, .3s, .38s;
  transition-timing-function: var(--ease-out);
}

/* ── Tema Escuro do painel de Configurações — vidro real, replicando
   1:1 o padrão ".ds-modal"/".ds-input" (vidro) de
   Referencias/VBM - Design System/Design_System_VBM.html ── */

  background: rgba(13,38,64,.92);

/* ════════════════════════════════════════════════════════════

   body[data-bg="dark"] da referência, que reskina TODOS os

    <!-- ═══ HERO BANNER ═══ -->
    <!-- NÃO usar loading="lazy" aqui: esta é a maior imagem visível na
         primeira dobra (o LCP da tela), e adiar seu início só atrasaria a
         pintura. O que dá para melhorar sem mudar o visual:
           • fetchpriority="high" — sobe na fila do navegador, à frente de
             recursos menos importantes;
           • decoding="async" — a decodificação sai da thread principal,
             então a interface não congela enquanto a imagem é processada.
         A ARTE É O 00_COMPOSICAO_ARTE.webp (162 KB). Antes era o
         00_COMPOSICAO_COMPLETA.svg, de 6,9 MB: um SVG que servia só de
         embrulho para 5 PNGs em base64 — um deles uma FOTO 2400x1145
         salva como PNG (3,9 MB) — e que, por ser base64, quase não
         comprimia (gzip tirava 31%). Era, disparado, o maior gargalo do
         app. Como o conteúdo já era todo raster, gerar um WebP no mesmo
         tamanho (2400x1145) não perde nada de nitidez: o que se perde é
         só o peso. Conferido lado a lado com a versão vetorial em
         1920x1080, inclusive no símbolo VPS e na textura da rocha, que
         são as partes mais sensíveis.

         06/10/2026: o símbolo VPS foi RETIRADO da arte (a área foi
         preenchida com a própria textura da rocha, com a iluminação
         casada nas bordas). O ?v= na URL força o navegador a buscar a
         versão nova — sem ele a cópia antiga, com o símbolo, podia ficar
         até 1 h em cache.

         Os dois arquivos antigos (00_COMPOSICAO_COMPLETA.svg e .webp)
         foram REMOVIDOS do projeto — ninguém os carregava e juntos
         pesavam 5,9 MB no pacote de deploy.

         Limite conhecido: 2400 px de largura. Em telas maiores que isso
         a arte é ampliada e perde um pouco de nitidez — exatamente como
         acontecia antes, já que os PNGs dentro do SVG também tinham
         2400 px.

         O TEXTO DA HERO NÃO ESTÁ DENTRO DA IMAGEM. Ele era <text>
         dentro do SVG e, por vir por <img>, ficava fora do alcance da
         página: não dava para traduzir nem para trocar a cor. Agora a
         arte vem no <img> e as palavras no <svg> logo abaixo, no MESMO
         sistema de coordenadas (viewBox 2400x1145) e com o mesmo
         enquadramento do object-fit da imagem — por isso aparecem
         exatamente onde apareciam. Sendo DOM de verdade, entram no
         data-i18n como qualquer outro texto da tela. -->
    <div class="dash-hero">
      <!-- Arte e texto dividem UM único wrapper animado: se cada um
           tivesse a sua animação de zoom, bastaria começarem com alguns
           milissegundos de diferença para o texto descolar da arte. -->
      <div class="dash-hero-zoom">
        <img class="dash-hero-bg-img"
             src="assets/images/00_COMPOSICAO_ARTE.webp?v=20261006-1"
             fetchpriority="high"
             decoding="async"
             data-i18n-alt="hero.alt"
             alt=""/>

        <!-- preserveAspectRatio="xMinYMax slice" é o equivalente exato,
             em SVG, do object-fit:cover + object-position:left bottom da
             imagem: mesmo recorte, mesma âncora, mesma escala em
             qualquer tamanho de tela.
             aria-hidden porque o alt da imagem já anuncia esta mesma
             frase — sem isso o leitor de tela leria tudo duas vezes. -->
        <svg class="dash-hero-texto" viewBox="0 0 2400 1145"
             preserveAspectRatio="xMinYMax slice" role="heading" aria-level="1"
             aria-label="Gestão Kaizen — Pessoas. Método. Resultado." focusable="false">
          <!-- 06/10/2026: o símbolo VPS saiu da arte (ficava em y≈239–436,
               acima deste bloco). Para não deixar o buraco, o bloco de texto
               sobe para o centro óptico da área abaixo do menu e cresce 10%,
               ocupando o espaço liberado. A transformação é aplicada ao
               grupo inteiro, em torno do canto superior esquerdo do bloco
               (169,485): as posições relativas entre as linhas não mudam e,
               por estar no mesmo viewBox/slice da arte, continua valendo em
               qualquer resolução. Topo do bloco: 332; base: ≈898 (de 1145). -->
          <g class="hero-bloco" transform="translate(169 332) scale(1.1) translate(-169 -485)">
            <text class="hero-antetitulo" x="169" y="502" data-i18n="hero.antetitulo">Kaizen System</text>
            <text class="hero-linha" x="169" y="629" fill="#ffffff" data-i18n="hero.linha1">Pessoas.</text>
            <text class="hero-linha" x="169" y="769" fill="#5fd0ff" data-i18n="hero.linha2">Método.</text>
            <text class="hero-linha" x="169" y="909" fill="#007e7a" data-i18n="hero.linha3">Resultado.</text>
            <text class="hero-subtitulo" x="169" y="993" data-i18n="hero.subtitulo">VBM Solução de Problemas e Melhoria Contínua</text>
          </g>
        </svg>

<!-- clientId/authority do Entra ID: fonte única, usada também pela tela
     de Aprovação para enviar o aviso da decisão. -->
<script src="js/msal-config.js?v=20260915-1"></script>
<script>
// ─── Login com conta Microsoft (MSAL.js / Azure AD - Entra ID) ───
// PENDENTE DE CONFIGURAÇÃO: preencha clientId e authority abaixo com os
// dados do app registrado no Azure Portal (Azure AD/Entra ID > App
// registrations > New registration):
//   • clientId  = "Application (client) ID" do app registrado
//   • authority = "https://login.microsoftonline.com/<TENANT_ID>"
//                 (Tenant ID = "Directory (tenant) ID", ou use
//                 "organizations" para aceitar qualquer tenant do Azure AD)
//   • Em "Authentication" no Azure Portal, adicione esta URL exata como
//     Redirect URI do tipo SPA: a própria URL desta página (ex.:
//     http://localhost/index.html ou o domínio final de produção).
//   • Em "API permissions", garanta o escopo "User.Read" (Microsoft Graph).
// Enquanto os campos abaixo estiverem com os placeholders, este bloco não
// tenta nenhum login — nada quebra. O cabeçalho ainda mostra a pessoa
// real: js/usuario-graph.js usa a identidade que o proxy do Databricks
// Apps já repassa (ver GET /api/me em server.js), sem depender do MSAL.
(function () {
  // clientId e authority moram em js/msal-config.js — um lugar só para
  // preencher, agora que a tela de Aprovação também precisa deles.
  if (!window.VBMMsal || !window.VBMMsal.estaConfigurado()) return;
  var MSAL_CONFIG = {
    clientId: window.VBMMsal.config.clientId,
    authority: window.VBMMsal.config.authority,
    // Sem a query nem o fragmento — o Entra compara o redirect_uri por
    // igualdade exata. Ver enderecoDeRetorno() em js/msal-config.js.
    redirectUri: window.location.origin + window.location.pathname
  };
  var LOGIN_SCOPES = ['User.Read'];

  // A msal-browser.min.js (~200 KB, CDN externo) só é baixada a partir
  // daqui — ou seja, apenas quando o login está de fato configurado.
  // Antes ela vinha num <script src> fixo no HTML e era baixada em todo
  // carregamento do dashboard, mesmo com os placeholders acima fazendo
  // este bloco sair na linha anterior sem usá-la para nada.
  var MSAL_CDN = 'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js';

  function carregarMsal() {
    return new Promise(function (resolve, reject) {
      if (typeof msal !== 'undefined') return resolve();
      var s = document.createElement('script');
      s.src = MSAL_CDN;
      s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Falha ao carregar ' + MSAL_CDN)); };
      document.head.appendChild(s);
    });
  }

  var nameEl   = document.getElementById('topnavUserName');
  var avatarEl = document.getElementById('topnavUserAvatar');

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var last  = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  // Render imediato, só com o que o token já traz (nome + iniciais).
  // A segunda linha (matrícula) NÃO é tocada aqui: ela vem do MDM via
  // js/usuario-graph.js, que já roda antes deste bloco (piso Databricks)
  // e é reforçada quando o Graph responder.
  function renderAccount(account) {
    if (!account) return;
    var name = account.name || account.username;
    if (nameEl) nameEl.textContent = name;
    if (avatarEl) avatarEl.textContent = initials(name);
  }

  // Perfil completo (nome, empresa, foto, cargo, gestor, etc.) fica a
  // cargo do js/usuario-graph.js, que reaproveita ESTE token — mesmo
  // escopo delegado User.Read, sem login novo. Só entregamos aqui a
  // função que devolve o access token; a busca no Graph, o cache da
  // sessão e a renderização no cabeçalho ficam lá, compartilhados com
  // as demais telas.
  function carregarPerfilGraph(msalInstance, account) {
    if (!window.VBMUsuario) return Promise.resolve(null);
    return VBMUsuario.carregarDoGraph(async function () {
      var tokenResp = await msalInstance.acquireTokenSilent({ scopes: LOGIN_SCOPES, account: account });
      return tokenResp.accessToken;
    });
  }

  (async function () {
    try {
      await carregarMsal();
    } catch (e) {
      // CDN indisponível: mantém o usuário mockado, como já acontecia
      // quando o <script src> externo falhava.
      console.warn('Login Microsoft indisponível, mantendo usuário padrão.', e);
      return;
    }

    var msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: MSAL_CONFIG.clientId,
        authority: MSAL_CONFIG.authority,
        redirectUri: MSAL_CONFIG.redirectUri
      },
      cache: { cacheLocation: 'sessionStorage' }
    });
    await msalInstance.initialize();

    try {
      var redirectResult = await msalInstance.handleRedirectPromise();
      var account = (redirectResult && redirectResult.account) || msalInstance.getAllAccounts()[0];

      if (!account) {
        // Sem sessão ativa: tenta login silencioso (SSO) e, se falhar,
        // redireciona para o login da Microsoft.
        try {
          var silent = await msalInstance.ssoSilent({ scopes: LOGIN_SCOPES });
          account = silent.account;
        } catch (silentErr) {
          msalInstance.loginRedirect({ scopes: LOGIN_SCOPES });
          return;
        }
      }

      msalInstance.setActiveAccount(account);
      // Nome/iniciais na hora, direto do token — a foto e a empresa
      // chegam logo depois, quando o Graph responder.
      renderAccount(account);
      await carregarPerfilGraph(msalInstance, account);
    } catch (e) {
      // Falha de autenticação: mantém o usuário mockado como fallback.
      console.warn('Login Microsoft indisponível, mantendo usuário padrão.', e);
    }
  })();
})();

// Topnav: vidro no topo da página, azul sólido ao rolar
(function(){
  var topnav = document.getElementById('topnav');
  if(!topnav) return;
  function onScroll(){
    topnav.classList.toggle('scrolled', window.scrollY > 8);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

(function(){
  // Mobile toggle for topnav drawer
  var btn    = document.getElementById('mobileToggle');
  var drawer = document.getElementById('topnavDrawer');
  if(btn && drawer){
    btn.addEventListener('click', function(){
      var open = drawer.classList.toggle('open');
      btn.querySelector('i').className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
    });
    // Close on outside click
    document.addEventListener('click', function(e){
      if(!btn.contains(e.target) && !drawer.contains(e.target)){
        drawer.classList.remove('open');
        btn.querySelector('i').className = 'fa-solid fa-bars';
      }
    });
  }
})();

// ─── Painel de Configurações (engrenagem) — replicado de Value Driver Tree ───
(function () {
  var btn = document.getElementById('settingsBtn');
  var panel = document.getElementById('settingsPanel');
  var backdrop = document.getElementById('settingsBackdrop');
  var closeBtn = document.getElementById('settingsClose');
  if (!btn || !panel || !backdrop) return;

  function openPanel() {
    panel.classList.add('open');
    backdrop.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    panel.setAttribute('aria-hidden', 'false');
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    panel.setAttribute('aria-hidden', 'true');
  }

  btn.addEventListener('click', function () {
    panel.classList.contains('open') ? closePanel() : openPanel();
  });
  closeBtn && closeBtn.addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
  });
})();

// ─── Tema (Claro/Escuro) do painel de Configurações ───
(function () {
  var THEME_KEY = 'vdt-theme';
  var btnWhite = document.getElementById('btnWhite');
  var btnBusiness = document.getElementById('btnBusiness');
  if (!btnWhite && !btnBusiness) return;

  function applyTheme(theme) {
    var isDark = theme === 'dark';
    document.body.dataset.bg = isDark ? 'dark' : '';
    if (btnWhite) btnWhite.classList.toggle('active', !isDark);
    if (btnBusiness) btnBusiness.classList.toggle('active', isDark);
  }

  var saved = 'light';
  try { saved = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light'; } catch (e) {}
  applyTheme(saved);

  btnWhite && btnWhite.addEventListener('click', function () {
    applyTheme('light');
    try { localStorage.setItem(THEME_KEY, 'light'); } catch (e) {}
  });
  btnBusiness && btnBusiness.addEventListener('click', function () {
    applyTheme('dark');
    try { localStorage.setItem(THEME_KEY, 'dark'); } catch (e) {}
  });
})();

// ─── Idioma (PT-BR/EN) do painel de Configurações ───
(function () {
  /* Dicionário de tradução — contém APENAS as chaves presentes no DOM
     desta página (topnav + painel de configurações). Ao adicionar um
     data-i18n no HTML, inclua a chave correspondente nos dois idiomas. */
  var I18N = {
    'pt-BR': {
      'a11y.abrirMenu': 'Abrir menu',
      'a11y.expandir': 'Expandir',
      'a11y.avancar': 'Avançar',
      'a11y.voltar': 'Voltar',
      'a11y.adicionar': 'Adicionar',
      'common.fechar': 'Fechar',
      'settings.btnTitle':   'Configurações',
      'settings.title':      'Configurações',
      'settings.close':      'Fechar',
      'settings.theme':      'Tema',
      'settings.language':   'Idioma',
      'settings.languageInfo': 'Idioma da interface',
      'theme.white':         'Claro',
      'theme.dark':          'Escuro',
      'nav.novoKaizen':      'Novo Kaizen',
      'nav.biblioteca':      'Biblioteca',
      'nav.aprovacao':       'Aprovação',
      'nav.administracao':   'Administração',
      'role.operador':       'Operador',
      /* Texto da hero: são os <text> do SVG sobreposto à arte. Entram
         aqui como qualquer outro texto da tela porque agora são DOM.
         'hero.alt' é o alt da imagem — a mesma frase, para quem usa
         leitor de tela. */
      'hero.antetitulo':     'Kaizen System',
      'hero.linha1':         'Pessoas.',
      'hero.linha2':         'Método.',
      'hero.linha3':         'Resultado.',
      'hero.subtitulo':      'VBM Solução de Problemas e Melhoria Contínua',
      'hero.alt':            'Gestão Kaizen — Pessoas. Método. Resultado.'
    },
    'en': {
      'a11y.abrirMenu': 'Open menu',
      'a11y.expandir': 'Expand',
      'a11y.avancar': 'Next',
      'a11y.voltar': 'Back',
      'a11y.adicionar': 'Add',
      'common.fechar': 'Close',
      'settings.btnTitle':   'Settings',
      'settings.title':      'Settings',
      'settings.close':      'Close',
      'settings.theme':      'Theme',
      'settings.language':   'Language',
      'settings.languageInfo': 'Interface language',
      'theme.white':         'Light',
      'theme.dark':          'Dark',
      'nav.novoKaizen':      'New Kaizen',
      'nav.biblioteca':      'Library',
      'nav.aprovacao':       'Approval',
      'nav.administracao':   'Administration',
      'role.operador':       'Operator',
      'hero.antetitulo':     'Kaizen System',
      'hero.linha1':         'People.',
      'hero.linha2':         'Method.',
      'hero.linha3':         'Result.',
      'hero.subtitulo':      'VBM Problem Solving & Continuous Improvement',
      'hero.alt':            'Kaizen Management — People. Method. Result.'
    }
  };

  var select = document.getElementById('langSelect');
  if (!select) return;

  /* Cada atributo data-i18n-* mapeia para uma propriedade/atributo do
     elemento. Tabela em vez de blocos repetidos: para suportar um novo
     alvo de tradução, basta acrescentar uma linha aqui. */
  var TARGETS = [
    ['data-i18n',             'textContent'],
    ['data-i18n-title',       'title'],
    ['data-i18n-aria',        'aria-label'],
    ['data-i18n-placeholder', 'placeholder'],
    ['data-i18n-alt',         'alt']
  ];

  function translate(lang) {
    var dict = I18N[lang] || I18N['pt-BR'];
    TARGETS.forEach(function (target) {
      var attr = target[0], prop = target[1];
      document.querySelectorAll('[' + attr + ']').forEach(function (el) {
        var value = dict[el.getAttribute(attr)];
        if (value == null) return;
        if (prop === 'textContent') el.textContent = value;
        else el.setAttribute(prop, value);
      });
    });
  }

  function applyLang(lang) {
    if (!I18N[lang]) lang = 'pt-BR';
    select.value = lang;
    translate(lang);
    try { localStorage.setItem('vdt-lang', lang); } catch (e) {}
    // Avisa quem mostra dados do banco (listas bilíngues) para
    // reconsultar no novo idioma — ver window.VBMIdioma em vbm-app.js.
    try { window.dispatchEvent(new Event('vbm:idioma')); } catch (e) {}
  }

  select.addEventListener('change', function () { applyLang(select.value); });

  var savedLang = 'pt-BR';
  try { savedLang = localStorage.getItem('vdt-lang') || 'pt-BR'; } catch (e) {}
  applyLang(savedLang);
})();
</script>
