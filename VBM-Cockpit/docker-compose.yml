# Local Postgres for exercising the SQL backend without Databricks.
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg://cockpit:cockpit@localhost:5432/cockpit
#   export DATA_BACKEND=sql
#   make migrate && make load
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      POSTGRES_DB: cockpit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
