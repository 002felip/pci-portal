# Databricks App — COO Dashboard (modo standalone)
# Conexão DIRETA ao Azure SQL de PRODUÇÃO (BDIBPBMSA_PRD), com pool próprio
# no server.js (pacote mssql). Dentro do Portal este arquivo não é usado: o
# Portal monta a pasta via portal.js e usa o app.yaml dele (ver docs/DEPLOYMENT.md).
command:
  - npm
  - start

env:
  # ── Banco: Azure SQL PRD (configuração não sensível) ──
  - name: 'AZURE_SQL_SERVER'
    value: 'rdb-ibp-bmsa-prd.database.windows.net'
  - name: 'AZURE_SQL_DATABASE'
    value: 'BDIBPBMSA_PRD'
  - name: 'AZURE_SQL_PORT'
    value: '1433'

  # ── Dashboard: IBP.DASHBOARD.ID_DASH dos indicadores do COO ──
  # Os scripts em database/ usam 15; o filtro entra na SQL por parâmetro.
  - name: 'COO_ID_DASH'
    value: '15'
  # Unidades liberadas (nomes de IBP.SITES, separados por vírgula).
  # FASE DE TESTE DE DADOS: só Sossego e Salobo. Para liberar todos: '*'
  - name: 'COO_SITES'
    value: 'Sossego,Salobo'

  # ── Credenciais: SEMPRE via secret do Databricks App, nunca em texto puro ──
  # Antes do PRIMEIRO deploy, em Compute > Apps > (este app) > Edit >
  # App resources > + Add resource > Secret, crie e CONFIRME que existem:
  #   resource key 'azure-sql-user'      → usuário com SELECT em IBP.*
  #   resource key 'azure-sql-password'  → senha desse usuário
  # Sem eles o app sobe, mas /api/health responde 503 e a página mostra
  # "dados de exemplo". (Lição do incidente do Kaizen em 20/09/2026: criar
  # os resources ANTES do deploy, nunca durante.)
  - name: 'AZURE_SQL_USER'
    valueFrom: 'azure-sql-user'
  - name: 'AZURE_SQL_PASSWORD'
    valueFrom: 'azure-sql-password'
